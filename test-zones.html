<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Porteo — Test zones dessinées</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" rel="stylesheet"/>
<link rel="preconnect" href="https://data.geopf.fr" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     MAQUETTE DE TEST « ZONES DESSINÉES » — page autonome, NON reliée à Glide.
     - Lecture seule côté Porteo : identité + zones de l'équipe (cellstates).
     - AUCUNE écriture dans Google Sheets / Apps Script : les zones dessinées
       et les statuts des portes restent sur CE téléphone (stockage local).
     ===================================================================== */
  :root{--accent:#f07020;--ink:#111827;--ink2:#6b7280;--surface:#fff;--border:#e7e9ee;--blue:#3b82f6;--green:#22c55e;--orange:#ff7a00;--wait:#facc15;--red:#ef4444;
    --sh:0 4px 14px rgba(17,24,39,.13);--sh-lg:0 14px 36px rgba(17,24,39,.25);--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:#0b0b0b;overflow:hidden;}
  button{font-family:inherit;}
  .maplibregl-marker{position:absolute;top:0;left:0;will-change:transform;}
  #map{position:fixed;inset:0;}

  /* ---------- Bandeau haut ---------- */
  #top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(10px + var(--sat)) 16px 0;pointer-events:none;}
  .bar{display:flex;align-items:center;gap:8px;pointer-events:auto;}
  .brand{background:rgba(17,24,39,.88);color:#fff;border-radius:12px;padding:7px 11px;font-size:12px;line-height:1.2;box-shadow:var(--sh);max-width:52%;}
  .brand b{display:block;font-size:13px;letter-spacing:.2px;}
  .brand span{color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
  .tag{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:800;letter-spacing:.4px;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px;}
  .sbox{flex:1;min-width:0;position:relative;}
  .sbox input{width:100%;border:none;border-radius:12px;padding:11px 12px;font-size:15px;font-family:inherit;box-shadow:var(--sh);outline:none;background:rgba(255,255,255,.97);}
  #sres{position:absolute;left:0;right:0;top:46px;background:#fff;border-radius:12px;box-shadow:var(--sh-lg);overflow:hidden;display:none;}
  #sres div{padding:11px 12px;font-size:14px;border-top:1px solid var(--border);cursor:pointer;}
  #sres div:first-child{border-top:none;}
  #banner{pointer-events:auto;margin-top:8px;background:rgba(17,24,39,.9);color:#fff;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:600;box-shadow:var(--sh);display:none;}
  #banner.on{display:block;}
  #banner small{display:block;font-weight:500;color:#cbd5e1;font-size:12px;margin-top:2px;}

  /* ---------- Boutons flottants ---------- */
  #fabs{position:fixed;right:16px;z-index:15;display:flex;flex-direction:column;gap:10px;transition:bottom .2s;}
  .fab{width:46px;height:46px;border-radius:14px;border:none;background:#fff;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
  .fab svg{width:22px;height:22px;}
  #legend{position:fixed;right:72px;z-index:16;background:#fff;border-radius:14px;box-shadow:var(--sh-lg);padding:12px 14px;font-size:13px;display:none;min-width:210px;}
  #legend.on{display:block;}
  #legend h4{margin:0 0 6px;font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;}
  #legend .li{display:flex;align-items:center;gap:8px;margin:5px 0;}
  .sw{width:16px;height:12px;border-radius:3px;flex:none;}
  .sw.dash{background:transparent;border:2px dashed var(--wait);}
  .dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid rgba(17,24,39,.4);}

  /* ---------- Panneau bas ---------- */
  #panel{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);padding:14px 16px calc(14px + var(--sab));max-height:72vh;overflow-y:auto;}
  @media (min-width:640px){#panel{left:50%;transform:translateX(-50%);width:460px;bottom:16px;border-radius:20px;}}
  .row{display:flex;gap:8px;}
  .row>*{flex:1;}
  .btn{border:none;border-radius:12px;padding:12px 10px;font-size:14.5px;font-weight:700;cursor:pointer;background:#f1f3f6;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;line-height:1.15;text-align:center;}
  .btn svg{width:18px;height:18px;flex:none;}
  .btn.pri{background:var(--accent);color:#fff;}
  .btn.dark{background:var(--ink);color:#fff;}
  .btn.ok{background:#16a34a;color:#fff;}
  .btn.blue{background:var(--blue);color:#fff;}
  .btn:disabled{opacity:.42;cursor:default;}
  .btn.sm{min-height:40px;padding:9px 10px;font-size:13.5px;}
  .lnk{background:none;border:none;color:var(--ink2);font-size:13px;font-weight:600;text-decoration:underline;padding:8px 4px;cursor:pointer;}
  .lnk.red{color:#b91c1c;}
  .muted{color:var(--ink2);font-size:13px;line-height:1.4;}
  .h1{font-size:17px;font-weight:800;margin:0 0 4px;}
  .gap{height:10px;}
  .gap6{height:6px;}

  /* compteur pendant le dessin */
  .pill{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;color:#fff;font-weight:800;font-size:16px;background:#9ca3af;}
  .pill .n{font-size:24px;letter-spacing:-.5px;}
  .pill small{display:block;font-size:12.5px;font-weight:600;opacity:.95;}
  .pill.low{background:#f59e0b;} .pill.good{background:#16a34a;} .pill.high{background:var(--red);}
  .warn{margin-top:8px;font-size:12.5px;color:#92400e;background:#fef3c7;border-radius:10px;padding:7px 10px;}
  .warn.info{color:#1e3a8a;background:#dbeafe;}

  /* carte zone */
  .zh{display:flex;align-items:center;gap:10px;}
  .code{white-space:nowrap;font-size:26px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;}
  .st{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;}
  .st.attente{background:#fef9c3;color:#854d0e;} .st.encours{background:#dbeafe;color:#1d4ed8;} .st.terminee{background:#dcfce7;color:#166534;} .st.aged{background:#ffedd5;color:#9a3412;}
  .dpebar{display:flex;gap:3px;margin-top:8px;}
  .dpebar div{flex:1;text-align:center;border-radius:6px;padding:4px 0 3px;font-size:11px;font-weight:800;line-height:1.1;}
  .dpebar div span{display:block;font-size:13px;}
  .dpebar div.z{opacity:.35;}
  .xp{margin-top:8px;font-size:13px;background:#fefce8;border:1px solid #fde68a;color:#713f12;border-radius:10px;padding:8px 10px;}
  .zl{border-top:1px solid var(--border);padding:11px 2px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .zl:first-of-type{border-top:none;}
  .zl b{font-size:16px;letter-spacing:1px;}
  .zl .muted{font-size:12.5px;}
  .zl .grow{flex:1;min-width:0;}
  .codein{width:100%;border:2px solid var(--border);border-radius:12px;padding:12px;font-size:22px;font-weight:800;letter-spacing:4px;text-align:center;text-transform:uppercase;font-family:inherit;outline:none;}
  .codein:focus{border-color:var(--accent);}

  /* parcours */
  #wtop{position:fixed;left:16px;right:16px;top:calc(10px + var(--sat));z-index:21;display:none;background:rgba(17,24,39,.92);color:#fff;border-radius:14px;padding:9px 12px;box-shadow:var(--sh);font-size:13px;}
  #wtop.on{display:flex;align-items:center;gap:10px;}
  #wtop b{font-size:15px;letter-spacing:1px;}
  #wtop .cnt{margin-left:auto;font-size:18px;font-weight:800;}
  #wtop .cnt small{font-size:12px;font-weight:600;color:#cbd5e1;}
  body.walking #top{display:none;}
  .hp{z-index:2;width:28px;height:28px;border-radius:50%;background:#fff;color:#111827;font-weight:800;font-size:12px;letter-spacing:-.3px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(0,0,0,.6);border:2px solid rgba(17,24,39,.45);cursor:pointer;}
  .hp.a{background:#f59e0b;color:#fff;border-color:#fff;} .hp.n{background:#6b7280;color:#fff;border-color:#fff;} .hp.r{background:#16a34a;color:#fff;border-color:#fff;}
  .hp.x{background:#fff;border:2px dashed #111827;}
  .hp.sel{transform:scale(1.25);box-shadow:0 0 0 4px rgba(240,112,32,.75),0 2px 7px rgba(0,0,0,.6);z-index:5;}
  .hp i{position:absolute;right:-6px;top:-6px;width:15px;height:15px;border-radius:5px;font-style:normal;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.35);}
  .stbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stbtns .btn{min-height:52px;}
  .b-a{background:#f59e0b!important;color:#fff!important;} .b-n{background:#6b7280!important;color:#fff!important;} .b-r{background:#16a34a!important;color:#fff!important;} .b-x{background:#fff!important;border:2px dashed #111827!important;}
  .btn.cur{outline:3px solid var(--ink);outline-offset:2px;}

  /* étiquettes des zones dessinées sur la carte */
  .zchip{background:#fff;border-radius:9px;padding:3px 7px;font-size:11.5px;font-weight:800;letter-spacing:.6px;box-shadow:0 2px 6px rgba(0,0,0,.45);display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;}
  body.tapmode .zchip{pointer-events:none;opacity:.75;}
  .zchip i{width:9px;height:9px;border-radius:50%;display:block;}
  /* position de test / GPS */
  .me{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25),0 2px 6px rgba(0,0,0,.5);}
  .me.sim{background:#a855f7;box-shadow:0 0 0 6px rgba(168,85,247,.25),0 2px 6px rgba(0,0,0,.5);}

  #toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + var(--sat));z-index:60;background:rgba(17,24,39,.94);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;}
  #toast.on{opacity:1;}
  #modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;}
  #modal.on{display:flex;}
  #modal .box{background:#fff;border-radius:18px;padding:18px 16px;max-width:420px;width:100%;box-shadow:var(--sh-lg);max-height:86vh;overflow-y:auto;}
  #modal ol{padding-left:20px;margin:8px 0;font-size:14px;line-height:1.45;}
  #modal ol li{margin:5px 0;}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="bar">
    <div class="brand"><b>Porteo<span class="tag">TEST</span></b><span id="who">Chargement…</span></div>
    <div class="sbox"><input id="q" type="search" placeholder="Ville, adresse…" autocomplete="off"><div id="sres"></div></div>
  </div>
  <div id="banner"></div>
</div>
<div id="wtop"></div>

<div id="fabs">
  <button class="fab" id="f-help" title="Aide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.8"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></svg></button>
  <button class="fab" id="f-leg" title="Légende"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button class="fab" id="f-gps" title="Ma position"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>
<div id="legend">
  <h4>Zones dessinées</h4>
  <div class="li"><span class="sw dash"></span>En attente de présence (48 h)</div>
  <div class="li"><span class="sw" style="background:var(--blue)"></span>En cours</div>
  <div class="li"><span class="sw" style="background:var(--green)"></span>Terminée (moins de 6 mois)</div>
  <div class="li"><span class="sw" style="background:var(--orange)"></span>Terminée (plus de 6 mois)</div>
  <h4 style="margin-top:10px">Quadrillage actuel (équipe)</h4>
  <div class="li"><span class="sw" style="background:rgba(59,130,246,.45);border:1px solid var(--blue)"></span>En cours</div>
  <div class="li"><span class="sw" style="background:rgba(34,197,94,.45);border:1px solid var(--green)"></span>Faite (moins de 6 mois)</div>
  <div class="li"><span class="sw" style="background:rgba(255,122,0,.45);border:1px solid var(--orange)"></span>Faite (plus de 6 mois)</div>
  <h4 style="margin-top:10px">Portes</h4>
  <div class="li"><span class="dot" style="background:#fff"></span>À faire</div>
  <div class="li"><span class="dot" style="background:#f59e0b"></span>Absent</div>
  <div class="li"><span class="dot" style="background:#6b7280"></span>Pas intéressé</div>
  <div class="li"><span class="dot" style="background:#16a34a"></span>RDV pris</div>
  <div class="li"><span class="dot" style="background:#fff;border:2px dashed #111827"></span>À refaire</div>
</div>

<div id="panel"></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="mbox"></div></div>

<script>
/* ========================= Constantes ========================= */
const SHEETS_URL='https://script.google.com/macros/s/AKfycbxiLRobw1pG1J99MaWQpEqFiYhHnQHMsIGDfeliYT3Fivc1GkcJcU_v3wbTq9gMpoq2/exec';   /* LECTURE SEULE : identité + cellstates */
const BDNB_TILES='https://api.bdnb.io/v1/bdnb/tuiles/batiment_groupe/{z}/{x}/{y}.pbf';
const BDNB_SRC='sql_statement';
const IGN='https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
const CELL=0.003;                 /* quadrillage actuel (affiché pour contexte) */
const MIN_H=30, MAX_H=150;        /* nombre de maisons individuelles exigé dans une zone */
const TOL_M=50;                   /* tolérance de localisation autour de la zone (m) */
const TTL_MS=48*3600*1000;        /* zone non commencée supprimée au bout de 48 h */
const RESUME_MS=12*3600*1000;     /* reprise sans relocalisation pendant 12 h sur ce téléphone */
const AGE_MS=6*30.44*24*3600*1000;/* fraîcheur : 6 mois */
const DRAW_MIN_ZOOM=15;
const CODE_ABC='ABCDEFGHJKMNPQRSTUVWXYZ23456789';   /* sans 0/O, 1/I/L → pas de confusion par SMS */
const DPE_COLORS={A:'#319834',B:'#33cc33',C:'#ccff33',D:'#ffff33',E:'#ffcc33',F:'#ff9933',G:'#ff3333'};
const RES={a:{l:'Absent',c:'b-a'},n:{l:'Pas intéressé',c:'b-n'},r:{l:'RDV pris',c:'b-r'},x:{l:'À refaire',c:'b-x'}};
const SK='porteo_zt_v1';          /* stockage local de la maquette (ce téléphone uniquement) */
const rowid=(new URLSearchParams(location.search).get('rowid')||'').trim();
const zParam=(new URLSearchParams(location.search).get('z')||'').trim();

/* ========================= État ========================= */
let map, ME={name:'',company:'',isAdmin:false,ok:false};
let ZONES=[];                     /* zones dessinées (local) */
let GRID=[];                      /* cases du quadrillage de l'équipe (lecture seule) */
let mode='idle';                  /* idle | draw | zone | list | code | walk | house | sim */
let DRAW=[];                      /* sommets du contour en cours */
let SEL=null;                     /* code de la zone ouverte */
let WALK=null;                    /* {code} parcours en cours */
let HSEL=null;                    /* maison sélectionnée pendant le parcours */
let _mkTap=0, _bVer=0, _bMemo=null, _hT=0, _drawStat={n:0,ok:false};
let zoneChips=[], walkPins=new Map(), meMarker=null;

/* ========================= Outils ========================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function $(id){return document.getElementById(id);}
function fc(f){return {type:'FeatureCollection',features:f};}
let _tt=0;function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('on'),ms||2600);}
async function fetchJson(u,ms){try{const c=new AbortController();const t=setTimeout(()=>{try{c.abort();}catch(e){}},ms||9000);const r=await fetch(u,{signal:c.signal});clearTimeout(t);return JSON.parse(await r.text());}catch(e){return null;}}
function fmtCode(c){return c?c.slice(0,3)+'-'+c.slice(3):'';}
function normCode(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function pad(n){return String(n).padStart(2,'0');}
function fmtDT(ts){const d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' à '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtLeft(ms){if(ms<=0)return '0 min';const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);return (h?h+' h ':'')+pad(m)+' min';}
function ic(n){const P={
  pen:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/>',
  list:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  check:'<path d="m5 12 5 5 9-10"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>',
  share:'<path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
  nav:'<path d="M3 11 21 3l-8 18-2-8-8-2Z"/>',
  pin:'<path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12Z"/><circle cx="12" cy="9" r="2.5"/>',
  flag:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'};
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+(P[n]||'')+'</svg>';}

/* géométrie (petites distances → projection locale en mètres) */
function mXY(p,lat0){return [p[0]*111320*Math.cos(lat0*Math.PI/180),p[1]*110540];}
function pip(pt,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
  if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function distToPolyM(pt,poly){const lat0=pt[1],P=mXY(pt,lat0);let best=Infinity;
  for(let i=0;i<poly.length;i++){const A=mXY(poly[i],lat0),B=mXY(poly[(i+1)%poly.length],lat0);const dx=B[0]-A[0],dy=B[1]-A[1];const L=dx*dx+dy*dy;
    let t=L?((P[0]-A[0])*dx+(P[1]-A[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));const x=A[0]+t*dx-P[0],y=A[1]+t*dy-P[1];best=Math.min(best,Math.sqrt(x*x+y*y));}
  return best;}
function segX(a,b,c,d){const o=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
  const d1=o(c,d,a),d2=o(c,d,b),d3=o(a,b,c),d4=o(a,b,d);return ((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));}
function selfCross(pts){const n=pts.length;if(n<4)return false;
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];for(let j=i+1;j<n;j++){if(j===i||(j+1)%n===i||(i+1)%n===j)continue;if(segX(a,b,pts[j],pts[(j+1)%n]))return true;}}return false;}
function bboxOf(pts){let w=180,s=90,e=-180,n=-90;pts.forEach(p=>{w=Math.min(w,p[0]);e=Math.max(e,p[0]);s=Math.min(s,p[1]);n=Math.max(n,p[1]);});return [[w,s],[e,n]];}
function avg(pts){let x=0,y=0;pts.forEach(p=>{x+=p[0];y+=p[1];});return [x/pts.length,y/pts.length];}
function ring(pts){return pts.concat([pts[0]]);}
function centroid(g){if(!g||!g.coordinates)return null;let r=g.coordinates;while(Array.isArray(r[0])&&Array.isArray(r[0][0]))r=r[0];if(!Array.isArray(r[0]))return null;let sx=0,sy=0;r.forEach(p=>{sx+=p[0];sy+=p[1];});return [sx/r.length,sy/r.length];}

/* ========================= Stockage local (ce téléphone) ========================= */
function loadZones(){try{const a=JSON.parse(localStorage.getItem(SK)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function saveZones(){try{localStorage.setItem(SK,JSON.stringify(ZONES));}catch(e){toast('Stockage du téléphone indisponible : la zone ne sera pas gardée.');}}
function alive(z){return z.status!=='attente'||(Date.now()-z.created)<TTL_MS;}
function purge(){const n=ZONES.length;ZONES=ZONES.filter(alive);if(ZONES.length!==n){saveZones();
  if(SEL&&!getZone(SEL)){SEL=null;if(mode==='zone')showIdle();}renderZones();refreshHouses();}}
function getZone(code){return ZONES.find(z=>z.code===code)||null;}
function zoneCat(z){if(z.status==='attente')return 'attente';if(z.status==='encours')return 'encours';return (Date.now()-(z.doneAt||z.created))<AGE_MS?'terminee':'aged';}
const CAT_COL={attente:'#facc15',encours:'#3b82f6',terminee:'#22c55e',aged:'#ff7a00'};
const CAT_LBL={attente:'En attente de présence',encours:'En cours',terminee:'Terminée',aged:'Terminée (+6 mois)'};
function genCode(){const used=new Set(ZONES.map(z=>z.code));for(let k=0;k<50;k++){const r=new Uint32Array(6);(window.crypto||{}).getRandomValues?crypto.getRandomValues(r):r.forEach((_,i)=>r[i]=Math.floor(Math.random()*1e9));
  let c='';r.forEach(v=>c+=CODE_ABC[v%CODE_ABC.length]);if(!used.has(c))return c;}return null;}

/* lien de partage autonome (maquette) : code + date + contour, SANS identifiant de l'expéditeur */
function encZone(z){const f=[];let px=0,py=0;z.pts.forEach((p,i)=>{const x=Math.round(p[0]*1e5),y=Math.round(p[1]*1e5);f.push(i?x-px:x,i?y-py:y);px=x;py=y;});
  return z.code+'.'+Math.floor(z.created/1000).toString(36)+'.'+f.map(v=>v.toString(36)).join('_');}
function decZone(s){try{const a=String(s).split('.');if(a.length!==3)return null;const code=normCode(a[0]);if(!/^[A-Z2-9]{6}$/.test(code))return null;
  const created=parseInt(a[1],36)*1000;if(!(created>1.6e12&&created<Date.now()+864e5))return null;
  const v=a[2].split('_').map(x=>parseInt(x,36));if(v.length<6||v.length%2||v.length>200||v.some(x=>!Number.isFinite(x)))return null;
  const pts=[];let x=0,y=0;for(let i=0;i<v.length;i+=2){x+=v[i];y+=v[i+1];pts.push([x/1e5,y/1e5]);}
  if(pts.some(p=>Math.abs(p[0])>180||Math.abs(p[1])>90))return null;return {code,created,pts};}catch(e){return null;}}
function shareUrl(z){return location.origin+location.pathname+'?z='+encZone(z);}

/* ========================= Carte ========================= */
async function hybrid(){
  const base={version:8,glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',sources:{ign:{type:'raster',tiles:[IGN],tileSize:256,maxzoom:19}},layers:[{id:'bg',type:'background',paint:{'background-color':'#0b0b0b'}}]};
  try{const KEY='porteo_style_v1';let st=null;try{st=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
    const get=()=>{const c=new AbortController();const t=setTimeout(()=>{try{c.abort();}catch(e){}},6000);
      return fetch('https://tiles.openfreemap.org/styles/positron',{signal:c.signal}).then(r=>r.json()).then(j=>{clearTimeout(t);if(j&&j.layers){try{localStorage.setItem(KEY,JSON.stringify(j));}catch(e){}}return j;});};
    if(st&&st.layers){get().catch(()=>{});}else{st=await get();}
    base.sources=Object.assign(base.sources,st.sources);base.glyphs=st.glyphs||base.glyphs;
    base.layers=base.layers.concat(st.layers.filter(l=>l.type!=='symbol'&&l.type!=='background'));
    base.layers.push({id:'ign',type:'raster',source:'ign'});
    base.layers=base.layers.concat(st.layers.filter(l=>l.type==='symbol'));
  }catch(e){}
  if(!base.layers.find(l=>l.id==='ign'))base.layers.push({id:'ign',type:'raster',source:'ign'});
  return base;}

/* ========================= Maisons BDNB ========================= */
function _tilesKey(){try{const sc=map.style&&map.style.sourceCaches&&map.style.sourceCaches.bdnb;if(sc&&sc.getRenderableIds)return _bVer+'|'+sc.getRenderableIds().join(',');}catch(e){}return null;}
/* mêmes règles que l'app : « Résidentiel individuel » ou 1 seul logement ; dédoublonnage par identifiant BDNB */
function buildings(){const tk=_tilesKey();if(tk&&_bMemo&&_bMemo.k===tk)return _bMemo.b;
  let feats=[];try{feats=map.querySourceFeatures('bdnb',{sourceLayer:BDNB_SRC});}catch(e){}
  const seen={},b=[];
  feats.forEach(f=>{const p=f.properties||{};const id=String(p.batiment_groupe_id||'');if(!id||seen[id])return;
    const indiv=String(p.usage_principal_bdnb_open||'')==='Résidentiel individuel'||parseInt(p.nb_log)===1;if(!indiv)return;
    const c=centroid(f.geometry);if(!c)return;seen[id]=1;
    const an=parseInt(p.annee_construction);const d=String(p.classe_bilan_dpe||'').trim().toUpperCase();
    b.push({id,c,an:(an>1700&&an<2100)?an:null,d:DPE_COLORS[d]?d:''});});
  if(tk)_bMemo={k:tk,b};return b;}
/* maisons déjà prises par une AUTRE zone dessinée vivante */
function claimedIds(exceptCode){const s=new Set();ZONES.forEach(z=>{if(z.code===exceptCode||!alive(z)||!z.ids)return;z.ids.forEach(i=>s.add(i));});return s;}
/* case du quadrillage faite / en cours depuis moins de 6 mois */
let GRIDREC=new Set();
function schedHouses(){clearTimeout(_hT);_hT=setTimeout(refreshHouses,120);}
function refreshHouses(){if(!map||!map.getSource('hs'))return;
  const B=buildings();const zSel=SEL?getZone(SEL):null;const wz=WALK?getZone(WALK.code):null;
  const cl=claimedIds(mode==='draw'?null:(zSel?zSel.code:null));
  const selIds=zSel&&zSel.ids?new Set(zSel.ids):null;const walkIds=wz&&wz.ids?new Set(wz.ids):null;
  const drawOn=mode==='draw'&&DRAW.length>=3;
  let n=0,nCl=0,nRec=0;const inIds=[];
  const F=B.map(h=>{let s=0;
    if(walkIds&&walkIds.has(h.id))s=3;
    else if(drawOn&&pip(h.c,DRAW)){if(cl.has(h.id)){s=2;nCl++;}else{s=1;n++;inIds.push(h);if(GRIDREC.has(Math.floor(h.c[0]/CELL)+'_'+Math.floor(h.c[1]/CELL)))nRec++;}}
    else if(selIds&&selIds.has(h.id))s=1;
    else if(cl.has(h.id))s=2;
    return {type:'Feature',properties:{s,dc:DPE_COLORS[h.d]||'#ffffff'},geometry:{type:'Point',coordinates:h.c}};});
  map.getSource('hs').setData(fc(F));
  if(mode==='draw'){_drawStat={n,nCl,nRec,list:inIds,cross:selfCross(DRAW)};renderDraw();}}

/* ========================= Quadrillage de l'équipe (lecture seule) ========================= */
function parseFR(s){const m=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(String(s||''));if(!m)return 0;let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]).getTime();}
function gridCat(c){const e=parseFR(c.dt||c.date);const rec=e?(Date.now()-e)<AGE_MS:!!c.recent;if(!rec)return 'aged';return (c.stat==='terminee'||c.stat==='nonpertinent')?'terminee':'encours';}
function renderGrid(){if(!map||!map.getSource('grid'))return;GRIDREC=new Set();
  const F=GRID.map(c=>{const p=String(c.k||'').split('_');const cx=+p[0],cy=+p[1];if(!Number.isFinite(cx)||!Number.isFinite(cy))return null;
    const cat=gridCat(c);if(cat!=='aged')GRIDREC.add(c.k);
    const w=cx*CELL,e=(cx+1)*CELL,s=cy*CELL,n=(cy+1)*CELL;
    return {type:'Feature',properties:{c:CAT_COL[cat]},geometry:{type:'Polygon',coordinates:[[[w,s],[e,s],[e,n],[w,n],[w,s]]]}};}).filter(Boolean);
  map.getSource('grid').setData(fc(F));}

/* ========================= Zones dessinées (affichage) ========================= */
function renderZones(){if(!map||!map.getSource('dz'))return;
  const F=ZONES.filter(alive).map(z=>{const cat=zoneCat(z);return {type:'Feature',properties:{code:z.code,c:CAT_COL[cat],att:cat==='attente'?1:0,sel:z.code===SEL?1:0},geometry:{type:'Polygon',coordinates:[ring(z.pts)]}};});
  map.getSource('dz').setData(fc(F));
  zoneChips.forEach(m=>m.remove());zoneChips=[];
  if(mode==='walk'||mode==='house')return;
  ZONES.filter(alive).forEach(z=>{const el=document.createElement('div');el.className='zchip';
    el.innerHTML='<i style="background:'+CAT_COL[zoneCat(z)]+'"></i>'+esc(fmtCode(z.code));
    el.addEventListener('click',ev=>{ev.stopPropagation();_mkTap=Date.now();if(mode==='draw'||mode==='sim')return;openZone(z.code,true);});
    zoneChips.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(z.ctr||avg(z.pts)).addTo(map));});}

/* ========================= Panneau ========================= */
let _lastPanel='';
function setPanel(html){if(html===_lastPanel)return;_lastPanel=html;$('panel').innerHTML=html;requestAnimationFrame(placeFabs);}   /* même contenu → pas de redessin (un toucher en cours n'est jamais perdu) */
function placeFabs(){const h=$('panel').offsetHeight||0;$('fabs').style.bottom=(h+16)+'px';$('legend').style.bottom=(h+16)+'px';}
window.addEventListener('resize',placeFabs);
function banner(html){const b=$('banner');if(html){b.innerHTML=html;b.classList.add('on');}else{b.classList.remove('on');b.innerHTML='';}}

function dblOn(){try{map.doubleClickZoom.enable();}catch(e){}document.body.classList.remove('tapmode');}
function tapMode(){try{map.doubleClickZoom.disable();}catch(e){}document.body.classList.add('tapmode');}   /* dessin / simulation : chaque toucher = un point (pas de zoom, étiquettes traversables) */
function showIdle(){dblOn();mode='idle';SEL=null;HSEL=null;banner('');renderZones();refreshHouses();
  const nz=ZONES.filter(alive).length;
  setPanel('<div class="h1">Zones dessinées <span class="tag">MAQUETTE</span></div>'+
    '<div class="muted">Dessinez une zone de '+MIN_H+' à '+MAX_H+' maisons, envoyez son code, puis localisez-vous dedans pour la prospecter.</div><div class="gap"></div>'+

    '<div class="row"><button class="btn sm" onclick="showList()">'+ic('list')+'Mes zones'+(nz?' ('+nz+')':'')+'</button><button class="btn sm" onclick="showCode()">'+ic('key')+'Ouvrir un code</button></div>');}

/* ---------- Dessin ---------- */
function startDraw(){
  if(map.getZoom()<DRAW_MIN_ZOOM){map.easeTo({zoom:16.2,duration:600});toast('Zoomez sur le quartier, puis touchez les coins de la zone.');}
  tapMode();
  mode='draw';DRAW=[];SEL=null;_drawStat={n:0};renderZones();drawLayer();refreshHouses();renderDraw();
  banner('Touchez la carte pour placer les coins de la zone<small>Vous pouvez déplacer et zoomer la carte entre deux points.</small>');}
function addPt(ll){if(map.getZoom()<DRAW_MIN_ZOOM-0.5){toast('Zoomez davantage pour dessiner précisément.');return;}
  if(DRAW.length>=40){toast('40 points maximum.');return;}DRAW.push(ll);drawLayer();refreshHouses();if(DRAW.length<3)renderDraw();}
function undoPt(){DRAW.pop();drawLayer();refreshHouses();renderDraw();}
function cancelDraw(){DRAW=[];drawLayer();showIdle();}
function drawCol(){const s=_drawStat;if(DRAW.length<3)return '#ffffff';if(s.cross)return '#ef4444';return s.n<MIN_H?'#f59e0b':(s.n>MAX_H?'#ef4444':'#16a34a');}
function drawLayer(){if(!map.getSource('dr'))return;const c=drawCol();const F=[];
  if(DRAW.length>=3)F.push({type:'Feature',properties:{c},geometry:{type:'Polygon',coordinates:[ring(DRAW)]}});
  if(DRAW.length>=2)F.push({type:'Feature',properties:{c},geometry:{type:'LineString',coordinates:DRAW.length>=3?ring(DRAW):DRAW}});
  DRAW.forEach(p=>F.push({type:'Feature',properties:{c},geometry:{type:'Point',coordinates:p}}));
  map.getSource('dr').setData(fc(F));}
function renderDraw(){if(mode!=='draw')return;drawLayer();const s=_drawStat,np=DRAW.length;
  let pill;
  if(np<3)pill='<div class="pill"><span class="n">'+np+'</span><div>point'+(np>1?'s':'')+' placé'+(np>1?'s':'')+'<small>Encore '+(3-np)+' minimum pour former une zone</small></div></div>';
  else if(s.cross)pill='<div class="pill high"><span class="n">!</span><div>Le contour se croise<small>Retirez le dernier point et contournez autrement</small></div></div>';
  else if(s.n<MIN_H)pill='<div class="pill low"><span class="n">'+s.n+'</span><div>maison'+(s.n>1?'s':'')+'<small>Encore '+(MIN_H-s.n)+' minimum — agrandissez la zone</small></div></div>';
  else if(s.n>MAX_H)pill='<div class="pill high"><span class="n">'+s.n+'</span><div>maisons<small>Trop grande : '+MAX_H+' maximum</small></div></div>';
  else pill='<div class="pill good"><span class="n">'+s.n+'</span><div>maisons<small>Zone valide — vous pouvez la créer</small></div></div>';
  let w='';
  if(np>=3&&s.nCl)w+='<div class="warn info">'+s.nCl+' maison'+(s.nCl>1?'s':'')+' déjà dans une autre zone dessinée (grisée'+(s.nCl>1?'s':'')+', non comptée'+(s.nCl>1?'s':'')+').</div>';
  if(np>=3&&s.nRec)w+='<div class="warn">'+s.nRec+' maison'+(s.nRec>1?'s':'')+' dans une zone de l’équipe faite il y a moins de 6 mois.</div>';
  const ok=np>=3&&!s.cross&&s.n>=MIN_H&&s.n<=MAX_H;
  setPanel(pill+w+'<div class="gap"></div><div class="row">'+
    '<button class="btn sm" onclick="undoPt()" '+(np?'':'disabled')+'>'+ic('undo')+'Point</button>'+
    '<button class="btn sm" onclick="cancelDraw()">'+ic('x')+'Annuler</button>'+
    '<button class="btn sm ok" onclick="validateDraw()" '+(ok?'':'disabled')+'>'+ic('check')+'Créer</button></div>');}
function validateDraw(){refreshHouses();const s=_drawStat;
  if(DRAW.length<3||s.cross||s.n<MIN_H||s.n>MAX_H){renderDraw();return;}
  const code=genCode();if(!code){toast('Impossible de générer un code, réessayez.');return;}
  const z=buildZone(code,DRAW.slice(),Date.now(),s.list);z.by=ME.name||'';
  ZONES.push(z);saveZones();DRAW=[];drawLayer();
  toast('Zone '+fmtCode(code)+' créée — '+z.n+' maisons');openZone(code,false);}
function buildZone(code,pts,created,list){
  const h={};list.forEach(b=>{h[b.id]=[+b.c[0].toFixed(6),+b.c[1].toFixed(6),b.d||'',b.an||0];});
  const ids=list.map(b=>b.id);const m=avg(pts);let best=null,bd=Infinity;
  list.forEach(b=>{const d=(b.c[0]-m[0])**2+(b.c[1]-m[1])**2;if(d<bd){bd=d;best=b.c;}});   /* point central = maison la plus proche du centre */
  return {code,pts,created,status:'attente',n:ids.length,ids,h,st:{},ad:{},ctr:best?[+best[0].toFixed(6),+best[1].toFixed(6)]:m};}
/* zone reçue par lien : maisons calculées sur place une fois les tuiles chargées */
function fillZoneHouses(z){const cl=claimedIds(z.code);const list=buildings().filter(b=>pip(b.c,z.pts)&&!cl.has(b.id));
  if(!list.length)return false;const nz=buildZone(z.code,z.pts,z.created,list);Object.assign(z,{n:nz.n,ids:nz.ids,h:nz.h,ctr:nz.ctr});saveZones();return true;}
function whenZoneLoaded(z,cb){map.fitBounds(bboxOf(z.pts),{padding:{top:90,bottom:Math.min(380,innerHeight*0.5),left:40,right:40},maxZoom:17.2,duration:500});
  let done=false;const go=()=>{if(done)return;done=true;cb();};map.once('idle',()=>setTimeout(go,150));setTimeout(go,9000);}

/* ---------- Carte d'une zone ---------- */
function openZone(code,fly){dblOn();const z=getZone(code);if(!z){toast('Zone introuvable (expirée ?)');showIdle();return;}
  mode='zone';SEL=code;banner('');renderZones();
  if(!z.ids){let tries=0;const fill=()=>{if(fillZoneHouses(z)){renderZones();refreshHouses();if(SEL===code&&mode==='zone')renderZoneCard();return;}
      if(++tries<4){setTimeout(fill,1500);return;}z.noH=1;if(SEL===code&&mode==='zone')renderZoneCard();};
    z.noH=0;whenZoneLoaded(z,fill);renderZoneCard();return;}
  if(fly)map.fitBounds(bboxOf(z.pts),{padding:{top:90,bottom:Math.min(380,innerHeight*0.5),left:40,right:40},maxZoom:17.2,duration:500});
  refreshHouses();renderZoneCard();}
function dpeBar(z){const c={A:0,B:0,C:0,D:0,E:0,F:0,G:0,'':0};(z.ids||[]).forEach(i=>{const h=z.h[i];c[(h&&h[2])||'']++;});
  return '<div class="dpebar">'+'ABCDEFG'.split('').map(L=>'<div class="'+(c[L]?'':'z')+'" style="background:'+DPE_COLORS[L]+';color:'+(L==='F'||L==='G'||L==='A'?'#fff':'#111827')+'">'+L+'<span>'+c[L]+'</span></div>').join('')+

function showMe(ll,sim){if(!meMarker){const el=document.createElement('div');el.className='me';meMarker=new maplibregl.Marker({element:el}).setLngLat(ll).addTo(map);}
  meMarker.getElement().classList.toggle('sim',!!sim);meMarker.setLngLat(ll);}
function locateFor(code){if(!navigator.geolocation){toast('GPS indisponible sur cet appareil.');return;}
  toast('Localisation en cours…',8000);
  navigator.geolocation.getCurrentPosition(p=>{tryLocate(code,[p.coords.longitude,p.coords.latitude],p.coords.accuracy,false);},
    e=>{toast(e&&e.code===1?'Accès à la position refusé : autorisez la localisation pour ce site.':'Position introuvable, réessayez à l’extérieur.',4000);},
    {enableHighAccuracy:true,timeout:15000,maximumAge:0});}
function tryLocate(code,ll,acc,sim){const z=getZone(code);if(!z){toast('Zone expirée.');showIdle();return;}showMe(ll,sim);
  const inside=pip(ll,z.pts),d=inside?0:distToPolyM(ll,z.pts);
  if(!inside&&d>TOL_M){dblOn();mode='zone';SEL=code;banner('');renderZoneCard();
    map.fitBounds(bboxOf(z.pts.concat([ll])),{padding:{top:90,bottom:Math.min(380,innerHeight*0.5),left:40,right:40},maxZoom:17,duration:500});
    toast('Vous êtes à '+(d>=1000?(d/1000).toFixed(1).replace('.',',')+' km':Math.round(d)+' m')+' de la zone. Rendez-vous sur place (bouton « Y aller ») puis réessayez.',5000);return;}
  if(z.status!=='encours'){z.status='encours';z.startedAt=Date.now();z.doneAt=null;}
  z.locAt=Date.now();z.loc={ll,acc:acc||null,sim:!!sim,t:Date.now()};saveZones();
  toast((sim?'Position simulée : ':'')+'vous êtes dans la zone '+fmtCode(code)+(acc?' (précision '+Math.round(acc)+' m)':''));
  startWalk(code);}

function paintPin(z,id){const m=walkPins.get(id);if(!m)return;const el=m.getElement(),h=z.h[id],s=z.st[id];
  ['a','n','r','x','sel'].forEach(c=>el.classList.remove(c));el.classList.add('hp');if(s)el.classList.add(s.r);if(HSEL===id)el.classList.add('sel');   /* classList : on garde les classes de positionnement MapLibre */

/* numéros des maisons (IGN, adresse la plus proche ; gardé sur le téléphone) */
let _geoRun=null;
async function geocodeZone(z){if(_geoRun===z.code)return;_geoRun=z.code;
  const todo=z.ids.filter(id=>!z.ad[id]&&z.h[id]);let i=0,changed=0;
  const one=async id=>{const h=z.h[id];for(let k=0;k<3;k++){
      let r=null;try{r=await fetch('https://data.geopf.fr/geocodage/reverse?lon='+h[0]+'&lat='+h[1]+'&index=address&limit=1&type=housenumber');}catch(e){r=null;}
      if(r&&r.status===429){await new Promise(s=>setTimeout(s,900*(k+1)));continue;}
      let j=null;try{j=r&&r.ok?await r.json():null;}catch(e){j=null;}
      const f=j&&j.features&&j.features[0];
      if(f&&f.geometry&&f.properties){const g=f.geometry.coordinates;const dm=Math.sqrt(mXY([g[0]-h[0],g[1]-h[1]],h[1]).reduce((a,v)=>a+v*v,0));
        const p=f.properties;const st=String(p.street||p.name||'').replace(/^\d+\s*/,'').trim();z.ad[id]=dm<=80?[String(p.housenumber||''),st]:['',st];}
      else z.ad[id]=['',''];
      return;}};
  const worker=async()=>{while(i<todo.length){const id=todo[i++];await one(id);changed++;
      if(WALK&&WALK.code===z.code)paintPin(z,id);if(changed%10===0)saveZones();}};
  await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
  saveZones();_geoRun=null;if(mode==='house'&&HSEL)openHouse(HSEL);}

function onMapClick(e){if(Date.now()-_mkTap<450)return;const ll=[e.lngLat.lng,e.lngLat.lat];
  if(mode==='draw'){addPt(ll);return;}
  if(mode==='sim'){const c=SEL;tryLocate(c,ll,null,true);return;}
  const box=[[e.point.x-10,e.point.y-10],[e.point.x+10,e.point.y+10]];
  if(mode==='walk'||mode==='house'){
    if(map.queryRenderedFeatures(box,{layers:['hs-c']}).length)toast('Cette maison est hors de la zone. Pour la faire : « Nouvelle zone à côté », puis localisez-vous dedans.',4200);
    else if(mode==='house')backWalk();
    return;}
  const z=map.queryRenderedFeatures(e.point,{layers:['dz-fill']});
  if(z.length){openZone(z[0].properties.code,false);return;}
  if(mode==='zone')showIdle();}

async function loadTeam(){if(!rowid){$('who').textContent='Sans identifiant';return;}
  const [idj,cs]=await Promise.all([fetchJson(SHEETS_URL+'?rowid='+encodeURIComponent(rowid)+'&t='+Date.now(),15000),
    fetchJson(SHEETS_URL+'?action=cellstates&rowid='+encodeURIComponent(rowid)+'&t='+Date.now(),20000)]);
  if(idj&&!idj.error&&idj.isActive!==false){ME={name:(idj.currentUser||idj.userName||'').trim(),company:(idj.clientName||idj.nom||'').trim(),isAdmin:!!idj.isAdmin,ok:true};
    $('who').textContent=[ME.company,ME.name].filter(Boolean).join(' · ')||'Connecté';}
  else $('who').textContent='Identifiant non reconnu';
  if(cs&&Array.isArray(cs.cells)){GRID=cs.cells;renderGrid();return cs;}
  return null;}
async function boot(){
  ZONES=loadZones();
  let imported=null;
  if(zParam){const d=decZone(zParam);
    if(!d)toast('Lien de zone invalide.');
    else if(Date.now()-d.created>=TTL_MS&&!getZone(d.code))toast('La zone '+fmtCode(d.code)+' a expiré (plus de 48 h sans présence).',4500);
    else{if(!getZone(d.code)){ZONES.push({code:d.code,pts:d.pts,created:d.created,status:'attente',n:0,ids:null,h:{},st:{},ad:{},ctr:avg(d.pts),by:'',recu:1});saveZones();}imported=d.code;}
    try{history.replaceState(null,'',location.pathname+(rowid?'?rowid='+encodeURIComponent(rowid):''));}catch(e){}}
  purge();
  const teamP=loadTeam();
  await initMap();
  renderZones();renderGrid();
  if(imported){openZone(imported,true);}
  else{showIdle();
    const last=ZONES.filter(alive).sort((a,b)=>b.created-a.created)[0];
    if(last)map.fitBounds(bboxOf(last.pts),{padding:{top:90,bottom:260,left:40,right:40},maxZoom:16.5,duration:0});
    else{const cs=await teamP;const L=(cs&&(cs.mine&&cs.mine.length?cs.mine:cs.cells))||[];
      const best=L.slice().sort((a,b)=>(b.ts||parseFR(b.dt||b.date))-(a.ts||parseFR(a.dt||a.date)))[0];
      if(best){const p=String(best.k).split('_');map.jumpTo({center:[(+p[0]+0.5)*CELL,(+p[1]+0.5)*CELL],zoom:15.6});}}
    let seen=false;try{seen=localStorage.getItem('porteo_zt_help')==='1';localStorage.setItem('porteo_zt_help','1');}catch(e){}
    if(!seen)help();}
