<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parcours rue Édouard Jenner, Angers</title>
<style>
:root{--ink:#17212c;--mut:#5b6672;--card:rgba(255,255,255,.95);--line:rgba(23,33,44,.12);--acc:#2459b8}
@media (prefers-color-scheme:dark){:root{--ink:#eef2f6;--mut:#9ba7b3;--card:rgba(22,28,36,.95);--line:rgba(255,255,255,.14);--acc:#7aa6ff}}
html,body{margin:0;height:100%;overflow:hidden;background:#dbe7f0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none;transition:opacity .4s}
.hd{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;max-width:calc(100% - 26px)}
h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
#chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;pointer-events:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-weight:500;font-size:13px;line-height:1;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.chip small{color:var(--mut);font-weight:400;margin-left:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.sheet{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:440px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px;transform:translateY(135%);transition:transform .5s cubic-bezier(.2,.8,.2,1);font-size:13px;line-height:1.45}
.sheet.on{transform:none}
#card h2{font-size:16px;font-weight:600;margin:0 30px 2px 0}
.k{color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.row span:last-child{text-align:right}
.sec{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.sec b{font-weight:600;font-size:12px;color:var(--mut)}
.bd{display:inline-block;padding:2px 9px;border-radius:7px;color:#fff;font-weight:600;font-size:12px;margin:6px 5px 4px 0}
#x{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:16px;line-height:1}
#dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .35s,transform .35s}
#dock.off{opacity:0;transform:translateY(20px);pointer-events:none}
#hint{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;color:var(--mut)}
#go{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:14px 22px;font-size:15px;font-weight:600;box-shadow:0 6px 18px rgba(36,89,184,.35)}
#ex{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 10px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .35s}
#ex.on{opacity:1;pointer-events:auto}
.pt{display:flex;justify-content:space-between;align-items:center;gap:10px}
#pcT{font-size:17px;font-weight:600}
.nav{display:flex;gap:6px}
.nav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:20px;line-height:1}
.bar{height:6px;border-radius:3px;background:var(--line);margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#1D9E75;border-radius:3px;transition:width .5s}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;padding:13px 6px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px;font-weight:600}
.acts button.pri{background:#7F77DD;border-color:#7F77DD;color:#fff}
.acts button:active{transform:scale(.97)}
#done{display:none;text-align:center;padding:6px 0 2px}
#done b{display:block;font-size:17px;margin-bottom:4px}
</style>
</head>

<canvas id="c"></canvas>
<div id="top"><div class="hd"><h1>Rue Édouard Jenner, Angers</h1><div class="sub" id="sub"></div></div><div id="chips"></div></div>

const st={p:new THREE.Vector3(),l:new THREE.Vector3(),gp:new THREE.Vector3(),gl:new THREE.Vector3(),yaw:0,pitch:0,gyaw:0,gpitch:0,fov:40,gfov:72};let zi=0;
function goStop(i){const prev=ZO[zi];if(prev)bubble(prev,false);zi=(i+ZO.length)%ZO.length;const z=ZO[zi];bubble(z,true);st.gp.copy(z.sp);st.gl.copy(z.lk);st.gyaw=0;st.gpitch=0;st.yaw*=.3;st.pitch*=.3;highlight(z.b);panel()}

function startParcours(){if(mode==='street')return;deselect();mode='street';st.p.copy(cam.position);st.l.copy(cur.t);st.fov=cam.fov;st.yaw=st.pitch=0;

function pickAt(cx,cy){const r=cv.getBoundingClientRect(),v=new THREE.Vector2((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1),rc=new THREE.Raycaster();rc.setFromCamera(v,cam);
const hit=rc.intersectObjects(cityMeshes.concat(hl.children.filter(o=>o.isMesh&&o!==hlRing)))[0];if(!hit)return null;const x=hit.point.x,z=hit.point.z;let best=null,bd=3;
for(const b of B){if(Math.abs(b.c[0]-x)>45||Math.abs(b.c[1]-z)>45)continue;if(pip(x,z,b.p))return b;const e=edge(x,z,b.p);if(e<bd){bd=e;best=b}}return best}

const ptr=new Map();let moved=false,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});moved=ptr.size>1;pinch=null});

p.x=e.clientX;p.y=e.clientY;
if(ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
if(pinch){if(mode==='street'){st.gfov=Math.min(80,Math.max(32,st.gfov*pinch.d/d))}else{goal.r=Math.min(700,Math.max(20,goal.r*pinch.d/d));const k=cur.r*.0016,sx=mx-pinch.mx,sy=my-pinch.my,c=Math.cos(cur.th),s=Math.sin(cur.th);goal.t.x-=(c*sx+s*sy)*k;goal.t.z-=(-s*sx+c*sy)*k;orbit=false}}pinch={d,mx,my}}});
const up=e=>{const was=ptr.size;ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(was===1&&!moved){const b=pickAt(e.clientX,e.clientY);
if(mode==='street'){if(b){const k=ZO.findIndex(q=>q.b===b);if(k>=0&&k!==zi)goStop(k)}}else{if(b)select(b);else if(sel)deselect()}}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);pinch=null});
cv.addEventListener('wheel',e=>{e.preventDefault();if(mode==='street')st.gfov=Math.min(80,Math.max(32,st.gfov*Math.exp(e.deltaY*.001)));else goal.r=Math.min(700,Math.max(20,goal.r*Math.exp(e.deltaY*.001)))},{passive:false});

function size(){R.setSize(innerWidth,innerHeight,false)}addEventListener('resize',size);size();
const t0=performance.now(),GROWT=2.9;let shadowsOn=false,treesDone=false,last=t0,vo=0;const tmp=new THREE.Vector3(),dir=new THREE.Vector3();
function loop(now){const t=(now-t0)/1000,dt=Math.min(.1,(now-last)/1000);last=now;U.uT.value=t;
if(!treesDone){setTrees(t);if(t>GROWT)treesDone=true}
if(!shadowsOn&&t>GROWT){shadowsOn=true;cityMeshes.forEach(m=>m.castShadow=true);R.shadowMap.needsUpdate=true;loadOrtho()}
const f=1-Math.exp(-dt*3.6),fs=1-Math.exp(-dt*2.4);
if(mode==='street'){st.p.lerp(st.gp,fs);st.l.lerp(st.gl,fs);st.yaw+=(st.gyaw-st.yaw)*f*1.6;st.pitch+=(st.gpitch-st.pitch)*f*1.6;st.fov+=(st.gfov-st.fov)*f;vo+=(.22-vo)*f;
dir.copy(st.l).sub(st.p);const hd=Math.hypot(dir.x,dir.z)||1,base=Math.atan2(dir.x,dir.z)+st.yaw,el=Math.atan2(dir.y,hd)+st.pitch;
cam.position.copy(st.p);tmp.set(st.p.x+Math.sin(base)*Math.cos(el),st.p.y+Math.sin(el),st.p.z+Math.cos(base)*Math.cos(el));cam.lookAt(tmp);cam.fov=st.fov}
else{if(orbit)goal.th+=.11*dt;vo+=((sel?.38:0)-vo)*f;cur.t.lerp(goal.t,f);cur.r+=(goal.r-cur.r)*f;cur.th+=(goal.th-cur.th)*f;cur.ph+=(goal.ph-cur.ph)*f;cam.fov+=(40-cam.fov)*f;
cam.position.set(cur.t.x+cur.r*Math.sin(cur.ph)*Math.sin(cur.th),cur.t.y+cur.r*Math.cos(cur.ph),cur.t.z+cur.r*Math.sin(cur.ph)*Math.cos(cur.th));cam.lookAt(cur.t)}

sky.position.copy(cam.position);
const dimT=(sel||mode==='street')?(mode==='street'?.78:.5):1;for(const k in MAT){const m=MAT[k];const c2=m.userData.k2==null?1:m.userData.k2;if(Math.abs(c2-dimT)>.002){const nk=c2+(dimT-c2)*f;m.userData.k2=nk;m.color.copy(m.userData.base).multiplyScalar(nk)}}
const pv=t>GROWT-.4?1:0;for(const k in PTS){const P=PTS[k],to=(!sel&&mode==='orbit'&&(filter==='all'||filter===k))?pv:0;P.material.opacity+=(to-P.material.opacity)*f*1.5;P.visible=P.material.opacity>.01;

const lo=(sel||mode==='street')?0:(t>1.2?1:0);LABS.forEach(s=>{s.material.opacity+=(lo-s.material.opacity)*f;s.visible=s.material.opacity>.01});
ZO.forEach((z,i)=>{const d=z.sp2.position.distanceTo(cam.position),to=mode==='street'?(d<120?1:0):0;z.sp2.material.opacity+=(to-z.sp2.material.opacity)*f*1.5;z.sp2.visible=z.sp2.material.opacity>.01;if(z.sp2.visible)z.sp2.position.y=z.b.top+1.9+Math.sin(t*1.6+i)*.12});
