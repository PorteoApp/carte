<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Portéo — Prospection par lotissement</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root{--accent:#f07020;--green:#16a34a;--ink:#1a1208;--ink2:#6b5e45;--surface:#fffdf9;--border:#eadfce;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:#000;overflow:hidden;}
  body{position:relative;}
  #map{position:absolute;inset:0;background:#0a0804;}
  #darkmask{position:absolute;inset:0;pointer-events:none;display:none;width:100%;height:100%;}
  .hidden{display:none !important;}
  #topbar{position:absolute;top:0;left:0;right:0;z-index:1300;display:flex;gap:8px;padding:10px 12px;pointer-events:none;}
  .tb-btn{pointer-events:auto;background:rgba(255,255,255,.96);border:none;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer;font-family:inherit;}
  .tb-btn:active{transform:scale(.96);}
  .tb-spacer{flex:1;pointer-events:none;}
  #search-screen{position:absolute;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;background:rgba(10,8,4,.72);backdrop-filter:blur(2px);}
  #search-screen h1{font-family:'DM Serif Display',serif;font-size:26px;color:#fff;text-align:center;margin:0 0 22px;line-height:1.25;max-width:340px;}
  .search-wrap{width:100%;max-width:420px;position:relative;}
  .search-field{position:relative;width:100%;}
  #search-input{width:100%;padding:17px 18px 17px 46px;border:none;border-radius:16px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.35);outline:none;}
  .search-ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.6;pointer-events:none;}
  #search-results{background:#fff;border-radius:14px;margin-top:8px;box-shadow:0 8px 30px rgba(0,0,0,.3);overflow:hidden;display:none;}
  .sr-item{padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--border);}
  .sr-item:last-child{border-bottom:none;} .sr-item:active{background:#f9f3ea;}
  .sr-name{font-size:15px;font-weight:600;} .sr-city{font-size:12px;color:var(--ink2);margin-top:1px;}
  #pending-zone.pending-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;margin-top:16px;background:linear-gradient(135deg,#fff2e6,#ffe3cd);border:1.5px solid #f6b98a;color:#9a4a12;border-radius:15px;padding:14px 16px;font-family:inherit;font-weight:800;font-size:14.5px;cursor:pointer;box-shadow:0 4px 16px rgba(240,112,32,.22);text-align:center;line-height:1.25;}
  #pending-zone.pending-btn:active{transform:scale(.98);}
  #pending-zone.pending-btn.hidden{display:none;}
  .search-links{margin-top:20px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .search-links a{color:#ffd9bf;font-size:13.5px;font-weight:600;text-decoration:none;cursor:pointer;}
  .search-links a b{color:#fff;}
  #username-chip{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:1550;color:#fff;font-size:12.5px;font-weight:700;pointer-events:none;background:rgba(15,10,4,.72);padding:5px 13px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.35);}
  .zmark{display:flex;flex-direction:column;align-items:center;cursor:pointer;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45));}
  .zmark .zm-card{background:#fff;border-radius:12px;padding:7px 11px;text-align:center;min-width:96px;}
  .zmark .zm-name{font-size:11px;font-weight:700;line-height:1.2;}
  .zmark .zm-sub{font-size:10px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;justify-content:center;}
  .zmark .zm-fg{color:#b91c1c;font-weight:700;}
  .zmark .zm-dpe{color:var(--accent);font-weight:700;}
  .zmark.chosen .zm-dpe{color:#fff;}
  .zmark .zm-tap{font-size:9px;font-weight:700;color:var(--accent);margin-top:3px;border-top:1px dashed var(--border);padding-top:3px;}
  .zmark.chosen .zm-tap{color:#fff;border-top-color:rgba(255,255,255,.5);}
  .zmark .zm-pin{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #fff;margin-top:-1px;}
  /* Surlignage de la rue / maison recherchée */
  .street-hl{background:rgba(250,204,21,.92);color:#1a1208;font-weight:800;font-size:13px;padding:0 5px;border-radius:3px;white-space:nowrap;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.5);}
  .house-hl{font-size:24px;color:#eab308;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));pointer-events:none;animation:hlbounce 1s ease-in-out infinite;}
  @keyframes hlbounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .zmark.taken{filter:grayscale(.5) drop-shadow(0 2px 6px rgba(0,0,0,.4));cursor:default;}
  .zmark.taken .zm-card{background:#eef0f2;} .zmark.taken .zm-name{color:#4b5563;}
  .zmark.chosen .zm-card{background:var(--accent);} .zmark.chosen .zm-name,.zmark.chosen .zm-sub,.zmark.chosen .zm-fg{color:#fff;} .zmark.chosen .zm-pin{border-top-color:var(--accent);}
  .bonhomme .bh-badge{width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:27px;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.5);animation:pulse 2s ease-in-out infinite;}
  .bonhomme.green .bh-badge{background:var(--green);}
  .zstatus{background:rgba(15,10,4,.82);color:#fff;font-weight:800;font-size:14px;letter-spacing:.3px;padding:5px 13px;border-radius:9px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.4);pointer-events:none;}
  .dpe-scale{display:flex;gap:3px;margin:14px 0 4px;}
  .ds-cell{flex:1;text-align:center;}
  .ds-let{height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
  .ds-n{font-size:12px;font-weight:700;margin-top:3px;}
  /* Sections de la fiche de zone */
  .zsec{border-top:1px solid var(--border);padding-top:10px;margin-top:12px;}
  .zsec:first-child{border-top:none;padding-top:0;margin-top:4px;}
  .zsec h4{margin:0 0 8px;font-size:13px;font-weight:800;color:var(--ink);letter-spacing:.2px;}
  .zsec-empty{font-size:12px;color:var(--ink2);}
  .hv{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border);}
  .hv:last-child{border-bottom:none;}
  .hv-name{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hv-date{font-size:12px;color:var(--ink2);white-space:nowrap;}
  /* Échelle DPE verticale (illustration réelle A→G) — largeur bornée (sinon trop étirée en desktop) */
  .dpe-ladder{display:flex;flex-direction:column;gap:3px;margin:8px 0 4px;max-width:300px;}
  .dl-row{display:flex;align-items:center;height:24px;border-radius:4px 9px 9px 4px;color:#1a1208;padding:0 10px 0 9px;font-weight:800;position:relative;transition:opacity .2s;}
  .dl-row .dl-let{font-size:13px;width:16px;}
  .dl-row .dl-bar{flex:1;}
  .dl-row .dl-n{font-size:12px;font-weight:800;background:rgba(255,255,255,.85);color:#1a1208;border-radius:6px;padding:1px 8px;min-width:22px;text-align:center;}
  .dl-row.empty{opacity:.28;}
  .dl-none{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--ink2);font-weight:600;}
  .dl-none .qm{width:20px;height:20px;border-radius:50%;background:#e5e7eb;color:#6b7280;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;}
  /* Schéma « âge des maisons » (code couleur par époque) — largeur bornée */
  .age-schema{margin:8px 0 4px;max-width:360px;}
  .age-bar{display:flex;height:16px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);}
  .age-seg{height:100%;}
  .age-legend{display:flex;justify-content:space-between;margin-top:6px;gap:4px;}
  .age-leg{flex:1;text-align:center;font-size:9.5px;color:var(--ink2);line-height:1.25;}
  .age-leg .al-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle;}
  .age-leg b{color:var(--ink);font-size:11px;}
  .age-avg{font-size:14px;color:var(--ink);margin:0 0 9px;text-align:center;background:#f7f2ea;border:1px solid var(--border);border-radius:11px;padding:9px;font-weight:700;}
  .age-avg b{color:var(--accent);font-size:16px;}
  .list-row .lr-name{font-size:14px;}
  /* Vue mobile : la carte (et toute l'app) fait 80% de la hauteur → webembed 20% plus court */
  @media(max-width:767px){
    html,body{height:68vh;background:transparent;}
    #map{background:#0a0804;}
    .sheet{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0;max-height:52vh;}
    .sheet h2{font-size:18px;} .sheet .loc{font-size:12px;margin-bottom:10px;}
    .btn{padding:13px;font-size:15px;margin-top:9px;} .btn.big{padding:15px;font-size:16px;}
    .meta-line{font-size:12px;margin:5px 0 3px;} .dpe-scale{margin:11px 0 3px;}
    .ds-let{height:23px;font-size:12px;} .ds-n{font-size:11px;}
    #search-screen h1{font-size:22px;margin-bottom:16px;} #search-input{padding:14px 16px 14px 42px;font-size:15px;}
    .memo{padding:10px 12px;max-height:118px;font-size:12px;} .zstatus{font-size:12px;padding:4px 10px;}
    .zmark .zm-card{padding:6px 9px;} .bonhomme .bh-badge{width:44px;height:44px;font-size:23px;}
    .tb-btn{padding:8px 12px;font-size:12px;} #reshuffle{bottom:16px;}
    #zoomhint{bottom:66px;max-width:82%;font-size:12px;}
    .map-pill{top:52px;font-size:12px;padding:8px 13px;}
    #manual-here{bottom:16px;}
    #zonecard{max-height:46vh;}
    #walker{max-height:64vh;}
    .zi-card,.hi-card{max-height:calc(100% - 40px);}
    .wk-scene{height:170px;}
    .sw-body{padding:12px 15px 11px;width:min(300px,66vw);} .sw-name{font-size:16px;}
  }
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
  /* Détail zone : ouverture partielle (pas jusqu'en haut), refermable */
  #zonecard{max-height:58vh;}
  /* Bouton « Rechercher manuellement » plus discret mais lisible */
  #manual-toggle{background:rgba(255,255,255,.8);color:#3a3226;font-weight:600;font-size:12px;padding:7px 13px;box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:1100;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.3);padding:14px 20px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;}
  .sheet.on{transform:translateY(0);}
  /* La fiche DÉTAIL d'une zone s'ouvre comme une carte centrée sous la barre du haut (jamais plein écran) */
  #fiche{top:56px;bottom:auto;left:50%;right:auto;width:min(390px,94vw);max-height:calc(100% - 78px);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.4);transform:translateX(-50%) translateY(-10px);opacity:0;visibility:hidden;pointer-events:none;}
  #fiche.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;pointer-events:auto;}
  .sheet-head{flex:none;position:relative;height:20px;margin-bottom:6px;}
  .sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:2px;}
  .sheet-x{position:absolute;top:-4px;right:-4px;width:32px;height:32px;border:none;border-radius:9px;background:#f0e9df;color:var(--ink);font-size:20px;line-height:1;cursor:pointer;z-index:3;}
  .sheet-x:active{transform:scale(.94);}
  .sheet-grab{width:40px;height:4px;border-radius:2px;background:#e3d9c8;margin:0 auto;}
  /* Carte-secteur (proposition unique + navigation) */
  .zc-nav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 9px;margin-bottom:6px;border-bottom:1px solid var(--border);}
  .zc-x{flex:none;width:38px;height:38px;border:none;border-radius:11px;background:#f0e9df;color:var(--ink);font-size:20px;line-height:1;cursor:pointer;}
  .zc-arrow{width:42px;height:42px;flex:none;border:none;border-radius:13px;background:#f0e9df;color:var(--ink);font-size:23px;font-weight:800;line-height:1;cursor:pointer;}
  .zc-arrow:active{transform:scale(.93);}
  .zc-arrow.off{opacity:.28;pointer-events:none;}
  .zc-count{font-size:14px;font-weight:800;color:var(--ink);text-align:center;flex:1;}
  .zc-foot{flex:none;padding-top:10px;margin-top:6px;border-top:1px solid var(--border);}
  .zc-foot .btn{margin-top:0;}
  .zc-taken{background:#f1f0ee;color:#6b5e45;border-radius:12px;padding:12px;text-align:center;font-weight:600;font-size:13px;line-height:1.4;}
  /* Vue « Tinder » : mini-carte + flèches */
  #swipecard{position:absolute;left:0;right:0;bottom:26px;z-index:970;display:none;align-items:center;justify-content:center;gap:10px;padding:0 12px;pointer-events:none;}
  #swipecard.on{display:flex;}
  #swipecard .sw-arrow{pointer-events:auto;width:46px;height:46px;flex:none;border:none;border-radius:50%;background:rgba(255,255,255,.97);color:var(--ink);font-size:25px;font-weight:800;line-height:1;box-shadow:0 3px 13px rgba(0,0,0,.32);cursor:pointer;}
  #swipecard .sw-arrow:active{transform:scale(.92);}
  #swipecard .sw-arrow.off{opacity:.28;pointer-events:none;}
  .sw-body{pointer-events:auto;position:relative;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.38);padding:15px 17px 14px;width:min(320px,70vw);cursor:pointer;text-align:center;}
  .sw-body:active{transform:scale(.99);}
  .sw-chip{display:inline-block;background:#fff4e6;color:#b45309;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;margin-bottom:7px;}
  .sw-name{font-family:'DM Serif Display',serif;font-size:18px;color:var(--ink);line-height:1.15;}
  .sw-sub{font-size:13.5px;color:var(--ink2);margin-top:5px;} .sw-sub b{color:var(--ink);} .sw-sub .sw-dpe{color:var(--accent);}
  .sw-sub.taken{color:#6b7280;font-weight:600;}
  .sw-tap{margin-top:9px;font-size:11.5px;font-weight:700;color:var(--accent);border-top:1px dashed var(--border);padding-top:8px;}
  .sheet h2{font-family:'DM Serif Display',serif;font-size:22px;margin:0 0 2px;}
  .sheet .loc{font-size:13px;color:var(--ink2);margin-bottom:14px;}
  .stat-row{display:flex;gap:8px;margin:14px 0;}
  .stat{flex:1;background:#fff;border:1px solid var(--border);border-radius:14px;padding:11px 8px;text-align:center;}
  .stat .n{font-size:20px;font-weight:700;line-height:1;} .stat .l{font-size:10.5px;color:var(--ink2);margin-top:4px;font-weight:600;}
  .stat.fg .n{color:#b91c1c;} .stat.de .n{color:#b45309;} .stat.nd .n{color:#64748b;}
  .meta-line{font-size:13px;font-weight:600;margin:6px 0 4px;display:flex;align-items:center;gap:7px;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .btn{all:unset;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;background:var(--accent);color:#fff;padding:16px;border-radius:15px;font-weight:700;font-size:16px;cursor:pointer;margin-top:12px;box-shadow:0 4px 14px rgba(240,112,32,.35);}
  .btn.big{padding:20px;font-size:18px;} .btn.green{background:var(--green);box-shadow:0 4px 14px rgba(22,163,74,.35);}
  .btn.ghost{background:#f2ece0;color:var(--ink);box-shadow:none;}
  .link-row{display:flex;gap:16px;justify-content:center;margin-top:14px;}
  .link-row a{color:var(--ink2);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;}
  .link-danger{color:#b91c1c !important;}
  .memo{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:6px;max-height:150px;overflow:auto;font-size:13px;line-height:1.5;}
  .memo h4{margin:0 0 6px;font-size:13px;} .memo ul{margin:0;padding-left:18px;} .memo li{margin:3px 0;} .memo b{color:var(--ink);}
  .warnbox{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:11px 13px;font-size:13px;color:#b45309;font-weight:600;margin-top:10px;line-height:1.4;}
  .pz-btn{display:block;width:100%;max-width:290px;margin:10px auto 2px;border-radius:11px;box-shadow:0 2px 9px rgba(0,0,0,.2);}
  .go-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .go-row .go-lbl{font-size:13px;font-weight:700;color:var(--ink2);}
  .go-btn{flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none;background:#eef3ff;color:#1d4ed8;border:1px solid #c7d7fb;border-radius:11px;padding:9px 6px;font-weight:700;font-size:13px;}
  .go-btn.waze{background:#e9f7ff;color:#0a7ea4;border-color:#b7e6f5;}
  .go-btn:active{transform:scale(.97);}
  #toast{position:absolute;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:1300;background:#1f2937;color:#fff;padding:13px 20px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;transition:.3s;pointer-events:none;max-width:86vw;text-align:center;}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  #loader{position:absolute;inset:0;z-index:1500;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .ring{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loader .lt{font-size:14px;color:var(--ink2);}
  /* Loader léger pendant la recherche d'un secteur */
  #zloader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:975;background:rgba(15,10,4,.9);border-radius:16px;padding:20px 26px;display:none;flex-direction:column;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);}
  #zloader.on{display:flex;}
  #zloader .ring{border-color:rgba(255,255,255,.25);border-top-color:#fff;}
  #zloader .lt{font-size:13.5px;color:#fff;font-weight:600;}
  /* Note centrée en mode recherche manuelle */
  #manual-hint{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);z-index:962;background:rgba(15,10,4,.86);color:#fff;font-size:13.5px;font-weight:600;line-height:1.45;text-align:center;padding:14px 20px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.45);display:none;max-width:84%;}
  #manual-hint.on{display:block;}
  /* Bouton test géoloc */
  #geo-test{margin-top:16px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
  #geo-test:active{transform:scale(.97);}
  #geo-test-res{margin-top:8px;font-size:11.5px;color:#ffd9bf;text-align:center;max-width:300px;line-height:1.4;min-height:14px;}
  #denied{position:absolute;inset:0;z-index:1600;background:var(--surface);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px;}
  #denied .ic{font-size:48px;} #denied h2{font-family:'DM Serif Display',serif;margin:0;} #denied p{color:var(--ink2);font-size:14px;max-width:280px;}
  #reshuffle{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:auto;z-index:900;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;}
  /* Pastilles de recherche manuelle */
  .map-pill{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:960;background:rgba(255,255,255,.96);border:none;border-radius:20px;padding:9px 16px;font-size:13px;font-weight:700;color:var(--ink);box-shadow:0 3px 12px rgba(0,0,0,.3);cursor:pointer;font-family:inherit;white-space:nowrap;}
  /* Filtres de la vue équipe (sur la carte) */

const SHEETS_URL='https://script.google.com/macros/s/AKfycbxiLRobw1pG1J99MaWQpEqFiYhHnQHMsIGDfeliYT3Fivc1GkcJcU_v3wbTq9gMpoq2/exec';

const IGN='https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
const ERA=[{c:'#dc2626',max:1949},{c:'#f97316',max:1979},{c:'#eab308',max:1999},{c:'#16a34a',max:3000}];
function eraOf(y){for(let i=0;i<ERA.length;i++)if(y<=ERA[i].max)return i;return 3;}

let map,_hybrid=null;
let state='search', shown=new Set(), proposal=[], chosen=null, nameCache={};
let isAdmin=false, userName='', clientId='', agingMonths=6;
let CELLSTATE={}, MINE=[], TEAM=[];    // état des cases (serveur)

/* ---------- Vue satellite hybride ---------- */
async function hybrid(){
  if(_hybrid)return _hybrid;
  const base={version:8,glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources:{ign:{type:'raster',tiles:[IGN],tileSize:256,maxzoom:19}},
    layers:[{id:'bg',type:'background',paint:{'background-color':'#0b0b0b'}},{id:'ign',type:'raster',source:'ign'}]};
  try{const st=await (await fetch('https://tiles.openfreemap.org/styles/positron')).json();
    st.layers=st.layers.filter(l=>l.type==='symbol');
    st.layers.forEach(l=>{if(l.paint&&l.paint['text-color']){l.paint['text-color']='#fff';l.paint['text-halo-color']='rgba(0,0,0,.75)';l.paint['text-halo-width']=1.4;}});
    base.sources=Object.assign(base.sources,st.sources);base.glyphs=st.glyphs||base.glyphs;base.layers=base.layers.concat(st.layers);
  }catch(e){}
  _hybrid=base;return base;
}

async function boot(){
  if(!urlRowId){ return deny('Accès refusé','Aucun identifiant dans le lien. Ouvre l’app depuis ton espace Portéo.'); }
  const mapP=initMap();   // on charge la carte EN PARALLÈLE de l'auth (ouverture plus rapide)
  const cached=loadAuth();
  if(cached){
    // Ouverture INSTANTANÉE depuis l'identité en cache ; le serveur est revérifié en arrière-plan
    applyIdentity(cached);
    _cellStatesP=refreshCellStates().then(()=>updateCounters());
    const sess=loadSession();const t=loadTarget();const hasResume=sess||(t&&Number.isFinite(t.cx)&&Number.isFinite(t.cy));
    if(!hasResume)document.getElementById('loader').classList.add('hidden');   // écran de recherche tout de suite
    await mapP;
    document.getElementById('loader').classList.add('hidden');
    if(sess)restoreSession(sess); else if(t&&Number.isFinite(t.cx))restoreTarget(t);
    revalidateAuth();
    return;
  }
  // Première ouverture (pas de cache) : flux bloquant
  let data=null;
  for(let a=0;a<5;a++){data=await fetchJson(SHEETS_URL+'?rowid='+encodeURIComponent(urlRowId)+'&t='+Date.now());if(data&&(!data.error||data.error==='notfound'))break;const lt=document.querySelector('#loader .lt');if(lt)lt.textContent='Connexion… ('+(a+2)+'/5)';await new Promise(r=>setTimeout(r,1000));}
  if(!data){await mapP.catch(()=>{});return deny('Serveur lent','Recharge la page.');}
  if(data.error==='notfound')return deny('Accès refusé','Identifiant non reconnu.');
  if(data.error)return deny('Erreur','Impossible de charger les données.');
  if(!data.isActive)return deny('Compte inactif','Ton compte n’est plus actif.');
  applyIdentity(data);saveAuth(data);
  _cellStatesP=refreshCellStates().then(()=>updateCounters());   // états en ARRIÈRE-PLAN (ne bloque plus l'ouverture)
  await mapP;
  document.getElementById('loader').classList.add('hidden');
  // Reprise EXACTE de la session, sinon zone « en attente/en cours »
  const sess=loadSession();const t=loadTarget();
  if(sess)restoreSession(sess); else if(t&&Number.isFinite(t.cx)&&Number.isFinite(t.cy)) restoreTarget(t);
}
async function revalidateAuth(){
  const data=await fetchJson(SHEETS_URL+'?rowid='+encodeURIComponent(urlRowId)+'&t='+Date.now());
  if(!data)return;                                   // réseau lent → on garde l'affichage optimiste
  if(data.error==='notfound'){clearAuth();return deny('Accès refusé','Identifiant non reconnu.');}
  if(data.error)return;                              // erreur transitoire → on ne bloque pas
  if(!data.isActive){clearAuth();return deny('Compte inactif','Ton compte n’est plus actif.');}
  applyIdentity(data);saveAuth(data);                // met à jour rôle / nom si changé côté serveur
}

function mkCell(cx,cy,info){return Object.assign({cx,cy,n:0,fg:0,de:0,nd:0,era:3,eras:[0,0,0,0],ys:[],dpe:{A:0,B:0,C:0,D:0,E:0,F:0,G:0,none:0},houses:[]},info||{});}
async function restoreSession(s){
  document.getElementById('search-screen').classList.add('hidden');
  document.getElementById('topbar').classList.remove('hidden');
  // Position + rendu IMMÉDIAT de la vue avec les infos mémorisées (pas d'attente des tuiles → plus de latence « carte vide »)
  if(s.map&&isFinite(s.map.lng))map.jumpTo({center:[s.map.lng,s.map.lat],zoom:s.map.zoom||15.6});
  else if(s.chosen)map.jumpTo({center:center(s.chosen.cx,s.chosen.cy),zoom:15.6});
  try{
    if(s.state==='team'){ openTeam(); if(s.zl)openZonesList(s.zl.scope); return; }
    if(s.state==='view'&&s.chosen){ viewZone(s.chosen.cx,s.chosen.cy,s.viewIt||{}); if(s.zl)openZonesList(s.zl.scope); return; }
    if((s.state==='attente'||s.state==='localise')&&s.chosen){
      chosen=mkCell(s.chosen.cx,s.chosen.cy,s.chosenInfo);
      if(s.state==='localise'){goLocalise(s.gps||null);} else chooseZone();
    } else if((s.state==='propose'||s.state==='manual')&&s.seq&&s.seq.length){
      _seq=s.seq.map((z,idx)=>mkCell(z.cx,z.cy, idx===(s.seqIdx||0)?s.chosenInfo:null));
      _seqIdx=Math.min(s.seqIdx||0,_seq.length-1);_seqMode=s.seqMode||'auto';_seqPt=s.seqPt||null;_detailOpen=!!s.detailOpen;
      s.seq.forEach(z=>shown.add(key(z.cx,z.cy)));
      await showZone();
    } else if(!s.walk){ goSearch(); if(s.zl)openZonesList(s.zl.scope); return; }
    if(s.zl)openZonesList(s.zl.scope);
    if(s.walk)resumeWalker(s.walk);   // pas d'await : la carte reste réactive
  }catch(e){goSearch();return;}
  // Enrichissement en arrière-plan : vraies maisons/DPE + navpool, une fois les tuiles chargées
  (async()=>{try{
    await new Promise(r=>map.once('idle',r));
    if(_cellStatesP){try{await _cellStatesP;}catch(e){}}
    const cells=scanCells();const get=(cx,cy)=>cells.find(x=>x.cx===cx&&x.cy===cy);
    if(_seq&&_seq.length){_seq=_seq.map(c=>get(c.cx,c.cy)||c);_navPool=(_seqMode==='manual')?cells.slice():cells.filter(c=>!stTaken(c));const rc=get(chosen.cx,chosen.cy);if(rc)chosen=rc;if(state==='propose')showZone();}
    else if(chosen){const rc=get(chosen.cx,chosen.cy);if(rc){chosen=rc;_activeCells=[chosen];updateQmarks();}}
    if(state==='localise'&&(!_curGps)){const m=mineFor(chosen);if(m&&m.gps)goLocalise(m.gps);}
  }catch(e){}})();
}

    const route=wk.routeKeys.map(k=>hm[k]).filter(Boolean);
    if(route.length){_walk.route=route;_walk.started=true;_walk.done=new Set(wk.done||[]);_walk.i=Math.max(0,Math.min(wk.i||0,route.length-1));

  try{const dm=document.getElementById('darkmask');if(dm)map.getCanvasContainer().appendChild(dm);}catch(e){}

    map.on('mouseenter','dpe-'+L,()=>map.getCanvas().style.cursor='pointer');

  });

  // Clic n'importe où sur la carte → ferme le bandeau ouvert (la zone + le bonhomme restent visibles)
  const DLYRS=['qmark-lyr','dpe-A','dpe-B','dpe-C','dpe-D','dpe-E','dpe-F','dpe-G'];
  map.on('click',e=>{
    if(!anySheetOpen())return;

  map.on('error',()=>{});

function fc(f){return {type:'FeatureCollection',features:f};}
function makeHatch(){const s=26,c=document.createElement('canvas');c.width=s;c.height=s;const x=c.getContext('2d');
  x.fillStyle='rgba(240,112,32,0.20)';x.fillRect(0,0,s,s);
  x.strokeStyle='rgba(240,112,32,0.85)';x.lineWidth=2.4;x.lineCap='round';
  x.beginPath();x.moveTo(-3,s+3);x.lineTo(s+3,-3);x.stroke();   // un seul trait diagonal, bien espacé
  if(!map.hasImage('hatch'))map.addImage('hatch',x.getImageData(0,0,s,s));}
function ensureQmark(){if(map.hasImage&&map.hasImage('qmark'))return;const s=46,c=document.createElement('canvas');c.width=s;c.height=s;const x=c.getContext('2d');x.shadowColor='rgba(0,0,0,0.32)';x.shadowBlur=4;x.shadowOffsetY=1.5;x.beginPath();x.arc(s/2,s/2,s/2-5,0,Math.PI*2);x.fillStyle='rgba(255,255,255,0.7)';x.fill();x.shadowColor='transparent';x.lineWidth=1.4;x.strokeStyle='rgba(255,255,255,0.95)';x.stroke();x.fillStyle='#1a1208';x.font='700 23px "DM Sans",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('?',s/2,s/2+1);try{map.addImage('qmark',x.getImageData(0,0,s,s));}catch(e){}}

/* ---------- Scan BDNB → cellules (avec maisons + DPE) ---------- */
function scanCells(){
  let feats=[];try{feats=map.querySourceFeatures('bdnb',{sourceLayer:BDNB_SRC});}catch(e){}
  const cells={},seen={};
  feats.forEach(f=>{const p=f.properties||{};const id=p.batiment_groupe_id;if(id){if(seen[id])return;seen[id]=1;}
    const indiv=String(p.usage_principal_bdnb_open||'')==='Résidentiel individuel'||parseInt(p.nb_log)===1;if(!indiv)return;
    const c=centroid(f.geometry);if(!c)return;
    const cx=Math.floor(c[0]/CELL),cy=Math.floor(c[1]/CELL),k=cx+'_'+cy;
    const cell=cells[k]||(cells[k]={cx,cy,n:0,known:0,eras:[0,0,0,0],fg:0,de:0,nd:0,dpe:{A:0,B:0,C:0,D:0,E:0,F:0,G:0,none:0},ys:[],houses:[]});
    cell.n++;const an=parseInt(p.annee_construction);const yr=(an>1700&&an<2100)?an:null;
    if(yr){cell.known++;cell.eras[eraOf(yr)]++;cell.ys.push(yr);}
    const dpe=String(p.classe_bilan_dpe||'').trim().toUpperCase();
    if('ABCDEFG'.indexOf(dpe)>=0&&dpe.length===1){cell.dpe[dpe]++;}else{cell.dpe.none++;}
    if(dpe==='F'||dpe==='G')cell.fg++;else if(dpe==='D'||dpe==='E')cell.de++;else cell.nd++;
    cell.houses.push({lon:c[0],lat:c[1],annee:yr});
  });
  return Object.values(cells).filter(c=>c.n>=MIN_MAISONS&&c.known>=1&&(c.known/c.n)>=MIN_COMPLET)
    .map(c=>{c.ys.sort((a,b)=>a-b);c.medY=c.ys.length?c.ys[Math.floor((c.ys.length-1)/2)]:null;c.era=c.medY!=null?eraOf(c.medY):3;c.dpeCount=c.n-c.dpe.none;return c;});
}
function centroid(g){if(!g||!g.coordinates)return null;let r=g.coordinates;while(Array.isArray(r[0])&&Array.isArray(r[0][0]))r=r[0];if(!Array.isArray(r[0]))return null;let sx=0,sy=0;r.forEach(p=>{sx+=p[0];sy+=p[1];});return [sx/r.length,sy/r.length];}

/* ---------- État / exclusion ---------- */
function stTaken(c){const s=CELLSTATE[key(c.cx,c.cy)];return !!(s&&s.recent);}   // pris = présence récente (dans le délai)
function dtOf(o){return o?(o.dt||o.date||''):'';}

/* ═══════ Moteur : UNE zone à la fois + navigation par swipe / flèches ═══════ */
function dist2(a,b){const dx=a[0]-b[0],dy=a[1]-b[1];return dx*dx+dy*dy;}
let _navPool=[], _seq=[], _seqIdx=-1, _seqMode='auto', _seqPt=null;
function buildNavPool(incl){ _navPool = incl ? scanCells() : scanCells().filter(c=>!stTaken(c)); }
async function ensureNavPool(incl){   // attend que les tuiles BDNB soient chargées (corrige « aucune zone »)
  buildNavPool(incl);
  for(let i=0;i<8 && !_navPool.length;i++){
    await new Promise(r=>{let done=false;const to=setTimeout(()=>{if(!done){done=true;r();}},500);
      const h=()=>{if(!done){done=true;clearTimeout(to);map.off('idle',h);r();}};map.on('idle',h);});
    buildNavPool(incl);
  }
  return _navPool.length;
}
async function expandNavPool(incl){   // voisinage épuisé → on élargit (léger dézoom + rechargement)
  toast('Voisinage épuisé — on élargit la zone…');
  map.easeTo({zoom:Math.max(MIN_ZOOM+0.3,map.getZoom()-1.3),duration:500});
  await new Promise(r=>map.once('idle',r));
  buildNavPool(incl);
}
function seqAvail(){return _navPool.filter(c=>!shown.has(key(c.cx,c.cy)));}
function pickFirstZone(){
  let avail=seqAvail(); if(!avail.length)avail=_navPool.slice();
  if(!avail.length)return null;
  // Rue/n° cherché OU clic manuel (_seqPt défini) → PILE la case du point si éligible, sinon la plus proche éligible.
  if(_seqPt){
    const cx=Math.floor(_seqPt[0]/CELL),cy=Math.floor(_seqPt[1]/CELL);
    const exact=avail.find(c=>c.cx===cx&&c.cy===cy);
    if(exact)return exact;
    return avail.slice().sort((a,b)=>dist2(center(a.cx,a.cy),_seqPt)-dist2(center(b.cx,b.cy),_seqPt))[0];
  }
  return avail[Math.floor(Math.random()*avail.length)];   // commune (sans point précis) → PUR hasard
}
async function pickNextZone(){
  let avail=seqAvail();
  if(!avail.length){ await expandNavPool(_seqMode==='manual'); avail=seqAvail(); }
  if(!avail.length){ shown=new Set(_seq.map(c=>key(c.cx,c.cy))); avail=seqAvail(); }   // dernier recours : on ne recycle que hors file
  if(!avail.length)return null;
  const cur=_seq[_seqIdx]; const ref=cur?center(cur.cx,cur.cy):(_seqPt||[map.getCenter().lng,map.getCenter().lat]);
  return avail.slice().sort((a,b)=>dist2(center(a.cx,a.cy),ref)-dist2(center(b.cx,b.cy),ref))[0];   // la plus proche → « à côté »
}
async function startSequence(pt,mode){
  clearMarks();closeSheets();hideSwipe();clearStatusLabels();showZLoader(true);
  if(map.getSource('dpe'))map.getSource('dpe').setData(fc([]));_dpeKey='';setQmarks([]);
  if(!pt&&mode==='auto')clearSearchHighlight();
  if(_cellStatesP){try{await _cellStatesP;}catch(e){}}
  _seqMode=mode;_seqPt=pt||null;
  const ok=await ensureNavPool(mode==='manual');
  if(!ok){ showZLoader(false);toast('Chargement des bâtiments… réessaie dans un instant'); if(mode==='manual')manualControls(true); return; }
  _seq=[];_seqIdx=-1;
  const first=pickFirstZone();
  if(!first){ showZLoader(false);toast('Aucun secteur libre ici'); return; }
  _seq.push(first);_seqIdx=0;shown.add(key(first.cx,first.cy));
  await showZone();
}

const DL_W={A:52,B:59,C:67,D:75,E:83,F:91,G:100};
function dpeScaleHtml(c){const order=['A','B','C','D','E','F','G'];
  // On privilégie les DPE réels (ADEME) réellement placés sur les maisons ; repli BDNB si pas encore chargé.
  const cd=CELL_DPE[key(c.cx,c.cy)];const d=cd?cd:(c.dpe||{});

  if(!any)return '<div style="font-size:11px;color:var(--ink2);text-align:center;margin:8px 0">DPE en cours de chargement…</div>';
  const rows=order.map(L=>{const n=d[L]||0;const tc=(L==='F'||L==='G')?'#fff':'#1a1208';
    return '<div class="dl-row'+(n?'':' empty')+'" style="width:'+DL_W[L]+'%;background:'+DPE_COLORS[L]+';color:'+tc+'"><span class="dl-let">'+L+'</span><span class="dl-bar"></span>'+(n?'<span class="dl-n">'+n+'</span>':'')+'</div>';}).join('');
  const none=d.none||0;
  const noneHtml=none>0?'<div class="dl-none"><span class="qm">?</span>'+none+' maison'+(none>1?'s':'')+' sans DPE connu</div>':'';

function dpeCountOf(c){const cd=CELL_DPE[key(c.cx,c.cy)];if(cd)return dpeMatched(cd);return c&&typeof c.dpeCount==='number'?c.dpeCount:0;}
// ── Schéma « âge des maisons » (code couleur par époque) ──
const ERA_LABELS=['Avant 1950','1950-79','1980-99','2000+'];
function ageSchemaHtml(c){const eras=c.eras||[0,0,0,0];const tot=eras.reduce((a,b)=>a+b,0);
  if(!tot)return '';
  const now=new Date().getFullYear();
  let meanY=c.medY;if(c.ys&&c.ys.length){meanY=Math.round(c.ys.reduce((a,b)=>a+b,0)/c.ys.length);}
  const segs=eras.map((n,i)=>n>0?'<div class="age-seg" style="width:'+(n/tot*100)+'%;background:'+ERA[i].c+'"></div>':'').join('');
  const leg=eras.map((n,i)=>'<div class="age-leg"><span class="al-dot" style="background:'+ERA[i].c+'"></span><b>'+n+'</b><br>'+ERA_LABELS[i]+'</div>').join('');
  const avg=meanY?'<div class="age-avg">Âge moyen : <b>'+(now-meanY)+' ans</b> <span style="font-weight:600;color:var(--ink2);font-size:12px">(≈ '+meanY+')</span></div>':'';
  return '<div class="age-schema">'+avg+'<div class="age-bar">'+segs+'</div><div class="age-legend">'+leg+'</div></div>';}

// La présence vient de la feuille (MapHalo), pas du GPS du navigateur → on interroge le serveur.
let _locPoll=null;
function startLocPoll(){stopLocPoll();_locPoll=setInterval(()=>{if(state==='attente')silentCheckLoc();},20000);}
function stopLocPoll(){if(_locPoll){clearInterval(_locPoll);_locPoll=null;}}
function mineFor(c){return (MINE||[]).find(x=>x.k===key(c.cx,c.cy)&&x.stat!=='terminee'&&x.stat!=='nonpertinent');}
async function silentCheckLoc(){await refreshCellStates();if(state!=='attente'||!chosen)return;const m=mineFor(chosen);if(m)goLocalise(m.gps);}
async function checkLoc(){toast('Vérification de ta présence…');await refreshCellStates();if(!chosen)return;const m=mineFor(chosen);if(m)goLocalise(m.gps);else toast('Si tu t’es déjà localisé, attends quelques instants et recommence');}

/* ---------- Localisé : en cours + choix de statut (plus de « frapper aux portes ») ---------- */
let _curGps=null;
function goLocalise(gps){state='localise';_curGps=gps||null;const c=chosen;saveTarget(c.cx,c.cy,'encours');clearPending();stopLocPoll();_activeCells=[c];
  setMask([{cx:c.cx,cy:c.cy}]);setCells([]);setHatch([{cx:c.cx,cy:c.cy}]);
  let ll=null;if(gps){const p=String(gps).split(',');const la=parseFloat(p[0]),lo=parseFloat(p[1]);if(isFinite(la)&&isFinite(lo))ll=[lo,la];}
  placeBonhomme(c.cx,c.cy,true,ll);   // bonhomme VERT aux coordonnées exactes de la localisation
  setStatusLabels([{cx:c.cx,cy:c.cy,text:'En cours',stat:''}]);
  renderStatusCard();updateQmarks();saveSession();
}
function renderStatusCard(){const c=chosen;
  document.getElementById('closure-body').innerHTML='<h2>'+esc((nameCache[key(c.cx,c.cy)]||'Secteur').split(',')[0])+'</h2>'
    +'<div class="loc">✅ Tu es sur zone — clôture quand tu as terminé</div>'
    +'<button class="btn" onclick="openWalker()">🚶 Démarrer le parcours guidé</button>'
    +'<div class="link-row" style="margin:8px 0 2px"><a onclick="openZoneInfo()">ℹ️ Infos de la zone</a></div>'
    +'<div class="memo"><h4>🏠 Les rues à faire</h4><div id="memo-sta">Chargement des rues…</div></div>'
    +'<button class="btn green" onclick="finish(\'terminee\')">✓ Secteur terminé</button>'
    +'<button class="btn ghost" onclick="finish(\'aterminer\')">⏸ À terminer plus tard</button>'
    +'<div class="link-row"><a class="link-danger" onclick="notRelevant()">Secteur non pertinent</a></div>';
  setSheetStat('closure','encours');openSheet('closure');fillMemo(c,'memo-sta');
}
function notRelevant(){document.getElementById('closure-body').innerHTML='<h2>Pourquoi non pertinent ?</h2><button class="btn ghost" onclick="finish(\'nonpertinent\')">🏢 Immeubles</button><button class="btn ghost" onclick="finish(\'nonpertinent\')">🚧 Accès impossible</button><button class="btn ghost" onclick="finish(\'nonpertinent\')">✋ Déjà démarchée</button>';}
async function finish(kind){const c=chosen;clearTarget();clearPending();stopLocPoll();const gps=center(c.cx,c.cy)[1].toFixed(6)+','+center(c.cx,c.cy)[0].toFixed(6);
  fetch(SHEETS_URL+'?action=setclosure&rowid='+encodeURIComponent(urlRowId)+'&gps='+encodeURIComponent(gps)+'&statut='+kind+'&t='+Date.now()).then(()=>refreshCellStates().then(updateCounters)).catch(()=>{});
  _activeCells=[];clearMarks();closeSheets();setMask([]);setCells([]);setHatch([]);setQmarks([]);clearStatusLabels();if(map.getSource('dpe'))map.getSource('dpe').setData(fc([]));

function parseDate(d){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(String(d||''));if(!m)return 0;let y=+m[3];if(y<100)y+=2000;return y*10000+(+m[2])*100+(+m[1]);}
function cmpDate(a,b){return parseDate(a)-parseDate(b);}          // >0 : a plus récent que b
function monthOf(d){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(String(d||''));if(!m)return '';let y=+m[3];if(y<100)y+=2000;return String(m[2]).padStart(2,'0')+'/'+y;}
function uniq(a){return Array.from(new Set(a.filter(Boolean)));}
function zlValid(it){return it&&it.k&&isFinite(+it.k.split('_')[0])&&isFinite(+it.k.split('_')[1]);}
function zlItems(){
  let src=_zl.src.filter(zlValid);const f=_zl.f;
  if(f.etat)src=src.filter(it=>(it.stat||'encours')===f.etat);
  if(f.jour)src=src.filter(it=>it.date===f.jour);
  if(f.mois)src=src.filter(it=>monthOf(it.date)===f.mois);
  if(f.com)src=src.filter(it=>(it.name||'')===f.com);
  return src.slice().sort((a,b)=>cmpDate(b.date,a.date));        // plus récent en haut
}

    wrap.appendChild(row);
  }
  if(pages>1){const pag=document.createElement('div');pag.className='zl-pager';
    pag.innerHTML='<button '+(_zl.page<=0?'disabled':'')+' onclick="zlPage(-1)">‹</button><span>Page '+(_zl.page+1)+' / '+pages+'</span><button '+(_zl.page>=pages-1?'disabled':'')+' onclick="zlPage(1)">›</button>';
    wrap.appendChild(pag);}
}

/* ---------- Sources & sheets ---------- */
let _maskCells=[];
function setMask(cells){_maskCells=cells||[];drawMask();}
// Masque = calque SVG en overlay (règle even-odd) : rectangle plein écran + « trous » = les cases éclairées,
// projetées en pixels. Aucun polygone WebGL → plus de bandes ni de taches noires bizarres.
function drawMask(){ const svg=document.getElementById('darkmask'),path=document.getElementById('darkmask-path'); if(!svg||!path||!map)return;
  if(!_maskCells.length){svg.style.display='none';return;}
  const cont=map.getContainer();const W=cont.clientWidth,H=cont.clientHeight;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.style.display='block';
  let d='M0 0 H'+W+' V'+H+' H0 Z';   // écran entier
  _maskCells.forEach(c=>{const ring=square(c.cx,c.cy);let sub='';
    ring.forEach((ll,i)=>{const p=map.project({lng:ll[0],lat:ll[1]});sub+=(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)+' ';});
    d+=' '+sub+'Z';});
  path.setAttribute('d',d);}
function setCells(cells){map.getSource('cells').setData(fc(cells.map(c=>({type:'Feature',properties:{col:c.col,op:c.op},geometry:{type:'Polygon',coordinates:[square(c.cx,c.cy)]}}))));}
function setHatch(cells){map.getSource('hatch').setData(fc(cells.map(c=>({type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[square(c.cx,c.cy)]}}))));}
function openSheet(id){closeSheets();document.getElementById(id).classList.add('on');}
function closeSheets(){['fiche','attente','arrival','closure','list','zonecard'].forEach(i=>document.getElementById(i).classList.remove('on'));}
function anySheetOpen(){return ['fiche','attente','arrival','closure','list','zonecard'].some(i=>document.getElementById(i).classList.contains('on'));}
let _tt=null;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),2600);}

/* ---------- Étiquettes de statut (texte au-dessus de la zone, pour ne pas dépendre que de la couleur) ---------- */
let _statusMarks=[];
function clearStatusLabels(){_statusMarks.forEach(m=>{try{m.remove();}catch(e){}});_statusMarks=[];}
function setStatusLabels(list){clearStatusLabels();(list||[]).forEach(it=>{
  const el=document.createElement('div');el.className='zstatus';el.style.borderBottom='3px solid '+statColor(it.stat);el.textContent=it.text;
  const lon=(it.cx+0.5)*CELL, latTop=(it.cy+1)*CELL;   // au bord haut de la zone
  _statusMarks.push(new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([lon,latTop]).addTo(map));});}

/* ══════════════ DPE (API ADEME) — pins colorés + card détaillée ══════════════ */
const ADEME_API='https://data.ademe.fr/data-fair/api/v1/datasets/dpe03existant/lines';
const SELECT_FIELDS=['etiquette_dpe','etiquette_ges','adresse_ban','adresse_brut','type_batiment','surface_habitable_logement','annee_construction','date_etablissement_dpe','date_visite_diagnostiqueur','numero_dpe','type_energie_principale_chauffage','type_generateur_chauffage_principal','periode_construction','qualite_isolation_plancher_bas','qualite_isolation_plancher_haut_comble_perdu','qualite_isolation_murs','qualite_isolation_menuiseries','qualite_isolation_enveloppe','cout_chauffage','type_ventilation','_geopoint'].join(',');
const DPE_COLORS={A:'#319834',B:'#33cc33',C:'#ccff33',D:'#ffff33',E:'#ffcc33',F:'#ff9933',G:'#ff3333'};
let DPE_INDEX={}, _dpeKey='', _dpeCache=[], _dpeLoadingKey='', CELL_DPE={};
function makePinDataUrl(color,letter,hasMulti){
  const multi=hasMulti?'<circle cx="32" cy="11" r="8" fill="#1a1208" stroke="#fff" stroke-width="2"/><text x="32" y="14.5" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">+</text>':'';
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="40" height="56" viewBox="0 0 40 56">'
    +'<path d="M20 2 C10 2 2 10 2 19 C2 31 20 53 20 53 C20 53 38 31 38 19 C38 10 30 2 20 2 Z" fill="#1a1208"/>'
    +'<path d="M20 4 C11 4 4 11 4 19 C4 30 20 50 20 50 C20 50 36 30 36 19 C36 11 29 4 20 4 Z" fill="'+color+'" stroke="#fff" stroke-width="2.5"/>'
    +'<circle cx="20" cy="19" r="9.5" fill="#fff" stroke="#1a1208" stroke-width="0.8" stroke-opacity="0.3"/>'
    +'<text x="20" y="24" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1208">'+letter+'</text>'+multi+'</svg>';
  return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
}
function ensureDpeImages(){['A','B','C','D','E','F','G'].forEach(l=>['','multi'].forEach(suf=>{
  const id='pin-'+l+(suf?'-'+suf:'');if(map.hasImage(id))return;
  const img=new Image(40,56);img.onload=()=>{if(!map.hasImage(id))map.addImage(id,img,{pixelRatio:2});};img.src=makePinDataUrl(DPE_COLORS[l],l,suf==='multi');}));}
function fmtDate(d){if(!d)return '—';const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?(m[3]+'/'+m[2]+'/'+m[1]):d;}
function summarizeChauffage(e,g){e=String(e||'').trim();g=String(g||'').trim();return (e&&g)?(e+' · '+g):(e||g||'—');}
function parseDpeRow(row){
  let lat=NaN,lon=NaN;if(row._geopoint){const p=String(row._geopoint).split(',');if(p.length>=2){lat=parseFloat(p[0]);lon=parseFloat(p[1]);}}
  if(!isFinite(lat)||!isFinite(lon))return null;
  const letter=String(row.etiquette_dpe||'').trim().toUpperCase();if(!DPE_COLORS[letter])return null;
  const surface=row.surface_habitable_logement;
  const tb=String(row.type_batiment||'').toLowerCase();const typeKey=tb.indexOf('maison')>=0?'maison':(tb.indexOf('appartement')>=0?'appartement':(tb.indexOf('immeuble')>=0?'immeuble':''));
  return {lat,lon,letter,typeKey,ges:String(row.etiquette_ges||'').trim().toUpperCase(),address:String(row.adresse_ban||row.adresse_brut||''),
    type:String(row.type_batiment||''),surface:surface?Math.round(parseFloat(surface)):'',year:row.annee_construction||row.periode_construction||'',
    date:row.date_etablissement_dpe||row.date_visite_diagnostiqueur||'',chauffage:summarizeChauffage(row.type_energie_principale_chauffage,row.type_generateur_chauffage_principal),
    numero:row.numero_dpe||'',isoEnveloppe:String(row.qualite_isolation_enveloppe||''),isoPlancherBas:String(row.qualite_isolation_plancher_bas||''),
    isoToiture:String(row.qualite_isolation_plancher_haut_comble_perdu||''),isoMurs:String(row.qualite_isolation_murs||''),isoMenuiseries:String(row.qualite_isolation_menuiseries||''),
    coutChauffage:row.cout_chauffage||'',ventilation:String(row.type_ventilation||'')};
}
function dedupeDpe(raw){const groups=new Map();for(const p of raw){const k=(p.address||'').toLowerCase().trim()||(p.lat.toFixed(6)+','+p.lon.toFixed(6));if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p);}
  const out=[];let id=0;for(const [k,list] of groups){list.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));const h=list[0];out.push(Object.assign({id:'dpe_'+(id++),history:list},h));}return out;}
async function loadDpeForCells(cells){
  const k=cells.map(c=>key(c.cx,c.cy)).sort().join('|');
  if(k===_dpeKey)return _dpeCache;
  if(k===_dpeLoadingKey)return _dpeCache;
  _dpeLoadingKey=k;
  let minx=180,miny=90,maxx=-180,maxy=-90;
  cells.forEach(c=>{minx=Math.min(minx,c.cx*CELL);maxx=Math.max(maxx,(c.cx+1)*CELL);miny=Math.min(miny,c.cy*CELL);maxy=Math.max(maxy,(c.cy+1)*CELL);});
  const pad=0.0008,bbox=[minx-pad,miny-pad,maxx+pad,maxy+pad];const active=new Set(cells.map(c=>key(c.cx,c.cy)));
  let pts=[];
  try{const j=await (await fetch(ADEME_API+'?size=10000&bbox='+bbox.join(',')+'&select='+encodeURIComponent(SELECT_FIELDS))).json();
    const raw=(j.results||[]).map(parseDpeRow).filter(Boolean).filter(p=>p.typeKey==='maison').filter(p=>active.has(Math.floor(p.lon/CELL)+'_'+Math.floor(p.lat/CELL)));
    pts=dedupeDpe(raw);
  }catch(e){}
  _dpeKey=k;_dpeCache=pts;_dpeLoadingKey='';return pts;
}
function showDpePopup(lngLat,dpe){
  const isoBadge=(val)=>{if(!val)return '—';const v=String(val).toLowerCase();let c='#9ca3af';
    if(v.includes('très bonne')||v.includes('tres bonne'))c='#319834';else if(v.includes('bonne'))c='#33cc33';else if(v.includes('moyenne'))c='#ffcc33';else if(v.includes('insuffisante'))c='#ff9933';
    return '<span style="display:inline-block;background:'+c+';color:'+((c==='#ff3333'||c==='#ff9933')?'#fff':'#1a1208')+';padding:1px 7px;border-radius:5px;font-weight:600;font-size:11px">'+val+'</span>';};
  const fmtCost=(n)=>{const v=parseFloat(n);return isFinite(v)?(Math.round(v).toLocaleString('fr-FR')+' €/an'):'';};
  const renderTab=(idx)=>{const cur=dpe.history[idx];const dc=DPE_COLORS[cur.letter]||'#999',gc=DPE_COLORS[cur.ges]||'#999';
    const dtc=(cur.letter==='F'||cur.letter==='G')?'#fff':'#1a1208',gtc=(cur.ges==='F'||cur.ges==='G')?'#fff':'#1a1208';
    const light=['B','C','D'].includes(cur.letter);const lbs=light?('background:#fff;color:#1a1208;border:3px solid '+dc):('background:#fff;color:'+dc+';border:2px solid rgba(0,0,0,0.1)');
    const hasIso=cur.isoEnveloppe||cur.isoPlancherBas||cur.isoToiture||cur.isoMurs||cur.isoMenuiseries;
    return '<div class="popup-header" style="background:'+dc+'"><div class="popup-letter-big" style="'+lbs+'">'+cur.letter+'</div><div><div class="popup-title" style="color:'+dtc+'">Étiquette DPE</div><div class="popup-class" style="color:'+dtc+'">Classe '+cur.letter+'</div></div></div>'
      +'<div class="popup-body">'
      +'<div class="popup-row"><span class="label">Adresse</span><span class="val">'+(cur.address||'—')+'</span></div>'
      +'<div class="popup-row"><span class="label">Type</span><span class="val">'+(cur.type||'—')+'</span></div>'
      +(cur.surface?'<div class="popup-row"><span class="label">Surface</span><span class="val">'+cur.surface+' m²</span></div>':'')
      +(cur.year?'<div class="popup-row"><span class="label">Construction</span><span class="val">'+cur.year+'</span></div>':'')
      +(cur.chauffage?'<div class="popup-row"><span class="label">Chauffage</span><span class="val">'+cur.chauffage+'</span></div>':'')
      +(cur.ventilation?'<div class="popup-row"><span class="label">Ventilation</span><span class="val">'+cur.ventilation+'</span></div>':'')
      +(cur.coutChauffage?'<div class="popup-section-divider"></div><div class="popup-section-title">💶 Coût annuel estimé</div><div class="popup-row"><span class="label">Chauffage</span><span class="val"><b>'+fmtCost(cur.coutChauffage)+'</b></span></div>':'')
      +(hasIso?'<div class="popup-section-divider"></div><div class="popup-section-title">🏗️ Qualité d\'isolation</div>'
        +(cur.isoEnveloppe?'<div class="popup-row"><span class="label">Enveloppe</span><span class="val">'+isoBadge(cur.isoEnveloppe)+'</span></div>':'')
        +(cur.isoMurs?'<div class="popup-row"><span class="label">Murs</span><span class="val">'+isoBadge(cur.isoMurs)+'</span></div>':'')
        +(cur.isoToiture?'<div class="popup-row"><span class="label">Toiture</span><span class="val">'+isoBadge(cur.isoToiture)+'</span></div>':'')
        +(cur.isoPlancherBas?'<div class="popup-row"><span class="label">Plancher bas</span><span class="val">'+isoBadge(cur.isoPlancherBas)+'</span></div>':'')
        +(cur.isoMenuiseries?'<div class="popup-row"><span class="label">Menuiseries</span><span class="val">'+isoBadge(cur.isoMenuiseries)+'</span></div>':''):'')
      +'<div class="popup-section-divider"></div>'
      +'<div class="popup-row"><span class="label">Date DPE</span><span class="val">'+fmtDate(cur.date)+'</span></div>'
      +(cur.ges?'<div class="popup-row"><span class="label">GES</span><span class="val"><span class="popup-ges" style="background:'+gc+';color:'+gtc+'">'+cur.ges+'</span></span></div>':'')
      +(cur.numero?'<div class="popup-row"><span class="label">N° DPE</span><span class="val" style="font-family:monospace;font-size:10px">'+cur.numero+'</span></div>':'')
      +'</div>';};
  function full(idx){let html='<button class="dpe-close" onclick="closeDpe()">×</button>';
    if(dpe.history.length>1){let tabs='<div class="popup-tabs">';dpe.history.forEach((h,i)=>{const c=DPE_COLORS[h.letter]||'#999',tc=(h.letter==='F'||h.letter==='G')?'#fff':'#1a1208';
      tabs+='<div class="popup-tab '+(i===idx?'active':'')+'" data-idx="'+i+'"><span class="tab-letter" style="background:'+c+';color:'+tc+'">'+h.letter+'</span>'+fmtDate(h.date)+'</div>';});tabs+='</div>';html+=tabs;}
    return html+renderTab(idx);}
  const card=document.getElementById('dpe-modal-card');
  function show(idx){card.innerHTML=full(idx);card.querySelectorAll('.popup-tab').forEach(tb=>tb.addEventListener('click',()=>show(parseInt(tb.dataset.idx))));}
  show(0);
  document.getElementById('dpe-modal').classList.add('on');
}

/* Swipe (droite → autre secteur, gauche → précédent) sur la mini-carte ET la fiche détail */
(function(){let sx=0,sy=0,st=0;
  function bind(el){if(!el)return;
    el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;st=Date.now();},{passive:true});
    el.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
      if(Date.now()-st<650&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){ _lastSwipe=Date.now(); if(dx>0)nextZone(); else prevZone(); }},{passive:true});
  }
  bind(document.getElementById('swipecard'));bind(document.getElementById('zonecard'));
})();
