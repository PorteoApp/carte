<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Portéo — Prospection par lotissement</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root{--accent:#f07020;--green:#16a34a;--ink:#1a1208;--ink2:#6b5e45;--surface:#fffdf9;--border:#eadfce;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:#000;overflow:hidden;}
  #map{position:absolute;inset:0;}
  .hidden{display:none !important;}
  #topbar{position:absolute;top:0;left:0;right:0;z-index:700;display:flex;gap:8px;padding:10px 12px;pointer-events:none;}
  .tb-btn{pointer-events:auto;all:unset;background:rgba(255,255,255,.94);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;gap:6px;}
  .tb-spacer{flex:1;}
  #search-screen{position:absolute;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;background:rgba(10,8,4,.72);backdrop-filter:blur(2px);}
  #search-screen h1{font-family:'DM Serif Display',serif;font-size:26px;color:#fff;text-align:center;margin:0 0 22px;line-height:1.25;max-width:340px;}
  .search-wrap{width:100%;max-width:420px;position:relative;}
  #search-input{width:100%;padding:17px 18px 17px 46px;border:none;border-radius:16px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.35);outline:none;}
  .search-ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.6;}
  #search-results{background:#fff;border-radius:14px;margin-top:8px;box-shadow:0 8px 30px rgba(0,0,0,.3);overflow:hidden;display:none;}
  .sr-item{padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--border);}
  .sr-item:last-child{border-bottom:none;} .sr-item:active{background:#f9f3ea;}
  .sr-name{font-size:15px;font-weight:600;} .sr-city{font-size:12px;color:var(--ink2);margin-top:1px;}
  .search-links{margin-top:20px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .search-links a{color:#ffd9bf;font-size:13.5px;font-weight:600;text-decoration:none;cursor:pointer;}
  .search-links a b{color:#fff;}
  #username-chip{position:absolute;top:12px;left:12px;z-index:1001;color:#fff;font-size:12px;font-weight:600;opacity:.8;}
  .zmark{display:flex;flex-direction:column;align-items:center;cursor:pointer;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45));}
  .zmark .zm-card{background:#fff;border-radius:12px;padding:7px 11px;text-align:center;min-width:96px;}
  .zmark .zm-name{font-size:11px;font-weight:700;line-height:1.2;}
  .zmark .zm-sub{font-size:10px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;justify-content:center;}
  .zmark .zm-fg{color:#b91c1c;font-weight:700;}
  .zmark .zm-pin{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #fff;margin-top:-1px;}
  .zmark.chosen .zm-card{background:var(--accent);} .zmark.chosen .zm-name,.zmark.chosen .zm-sub,.zmark.chosen .zm-fg{color:#fff;} .zmark.chosen .zm-pin{border-top-color:var(--accent);}
  .bonhomme .bh-badge{width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:27px;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.5);animation:pulse 2s ease-in-out infinite;}
  .zstatus{background:rgba(15,10,4,.82);color:#fff;font-weight:800;font-size:14px;letter-spacing:.3px;padding:5px 13px;border-radius:9px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.4);pointer-events:none;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:1100;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.3);padding:20px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:82vh;overflow:auto;}
  .sheet.on{transform:translateY(0);}
  .sheet-grab{width:40px;height:4px;border-radius:2px;background:#e3d9c8;margin:0 auto 14px;}
  .sheet h2{font-family:'DM Serif Display',serif;font-size:22px;margin:0 0 2px;}
  .sheet .loc{font-size:13px;color:var(--ink2);margin-bottom:14px;}
  .stat-row{display:flex;gap:8px;margin:14px 0;}
  .stat{flex:1;background:#fff;border:1px solid var(--border);border-radius:14px;padding:11px 8px;text-align:center;}
  .stat .n{font-size:20px;font-weight:700;line-height:1;} .stat .l{font-size:10.5px;color:var(--ink2);margin-top:4px;font-weight:600;}
  .stat.fg .n{color:#b91c1c;} .stat.de .n{color:#b45309;} .stat.nd .n{color:#64748b;}
  .meta-line{font-size:13px;font-weight:600;margin:6px 0 4px;display:flex;align-items:center;gap:7px;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .btn{all:unset;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;background:var(--accent);color:#fff;padding:16px;border-radius:15px;font-weight:700;font-size:16px;cursor:pointer;margin-top:12px;box-shadow:0 4px 14px rgba(240,112,32,.35);}
  .btn.big{padding:20px;font-size:18px;} .btn.green{background:var(--green);box-shadow:0 4px 14px rgba(22,163,74,.35);}
  .btn.ghost{background:#f2ece0;color:var(--ink);box-shadow:none;}
  .link-row{display:flex;gap:16px;justify-content:center;margin-top:14px;}
  .link-row a{color:var(--ink2);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;}
  .link-danger{color:#b91c1c !important;}
  .memo{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:6px;max-height:150px;overflow:auto;font-size:13px;line-height:1.5;}
  .memo h4{margin:0 0 6px;font-size:13px;} .memo ul{margin:0;padding-left:18px;} .memo li{margin:3px 0;} .memo b{color:var(--ink);}
  .warnbox{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:11px 13px;font-size:13px;color:#b45309;font-weight:600;margin-top:10px;line-height:1.4;}
  #toast{position:absolute;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:1300;background:#1f2937;color:#fff;padding:13px 20px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;transition:.3s;pointer-events:none;max-width:86vw;text-align:center;}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  #loader{position:absolute;inset:0;z-index:1500;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .ring{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loader .lt{font-size:14px;color:var(--ink2);}
  #denied{position:absolute;inset:0;z-index:1600;background:var(--surface);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px;}
  #denied .ic{font-size:48px;} #denied h2{font-family:'DM Serif Display',serif;margin:0;} #denied p{color:var(--ink2);font-size:14px;max-width:280px;}
  #reshuffle{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:auto;z-index:900;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;}
  #list-items{margin:6px 0 4px;}
  .list-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
  .list-row:active{background:#f9f3ea;}
  .lr-main{flex:1;min-width:0;} .lr-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .lr-sub{font-size:12px;color:var(--ink2);margin-top:1px;}
  /* ---- Card DPE (module ADEME) ---- */
  .dpe-popup .maplibregl-popup-content{font-family:'DM Sans',sans-serif;padding:0;border-radius:13px;box-shadow:0 6px 22px rgba(0,0,0,.28);overflow:hidden;width:250px;max-width:250px;}
  .dpe-popup .maplibregl-popup-tip{display:none;}
  .dpe-popup .maplibregl-popup-close-button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.95);color:#1a1208;font-size:17px;line-height:22px;border:none;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:10;}
  .dpe-popup .popup-header{padding:10px 12px;display:flex;align-items:center;gap:9px;}
  .dpe-popup .popup-letter-big{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0;}
  .dpe-popup .popup-title{font-size:9px;text-transform:uppercase;letter-spacing:.3px;font-weight:600;opacity:.85;}
  .dpe-popup .popup-class{font-size:12px;font-weight:700;}
  .dpe-popup .popup-body{padding:8px 12px 10px;background:#fff;max-height:44vh;overflow:auto;}
  .dpe-popup .popup-row{font-size:11px;color:var(--ink);padding:3px 0;line-height:1.35;display:flex;gap:8px;}
  .dpe-popup .popup-row .label{color:var(--ink2);font-weight:600;font-size:9px;text-transform:uppercase;letter-spacing:.2px;flex-shrink:0;width:78px;padding-top:1px;}
  .dpe-popup .popup-row .val{flex:1;word-break:break-word;}
  .dpe-popup .popup-ges{display:inline-flex;align-items:center;padding:1px 7px;border-radius:5px;font-weight:700;font-size:11px;}
  .dpe-popup .popup-tabs{display:flex;border-top:1px solid var(--border);background:#faf5ee;overflow-x:auto;scrollbar-width:none;}
  .dpe-popup .popup-tabs::-webkit-scrollbar{display:none;}
  .dpe-popup .popup-tab{flex:0 0 auto;min-width:88px;padding:6px 8px;font-size:9px;font-weight:600;color:var(--ink2);text-align:center;cursor:pointer;border-right:1px solid var(--border);}
  .dpe-popup .popup-tab.active{background:#fff;color:var(--ink);}
  .dpe-popup .popup-tab .tab-letter{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:3px;vertical-align:-1px;font-size:7px;line-height:11px;text-align:center;font-weight:700;}
  .dpe-popup .popup-section-divider{border-top:1px solid var(--border);margin:6px -12px 5px;}
  .dpe-popup .popup-section-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin:3px 0;}
</style>
</head>
<body>
<div id="map"></div>
<div id="topbar" class="hidden">
  <button class="tb-btn" onclick="goSearch()">← Rechercher</button>
  <div class="tb-spacer"></div>
  <button class="tb-btn" onclick="recenter()">◎ Me recentrer</button>
</div>
<div id="username-chip" class="hidden"></div>

<div id="search-screen">
  <h1>Où prospectes-tu<br>aujourd'hui ?</h1>
  <div class="search-wrap">
    <span class="search-ico">🔍</span>
    <input id="search-input" type="text" autocomplete="off" placeholder="Rue, quartier ou commune">
    <div id="search-results"></div>
  </div>
  <div class="search-links">
    <a onclick="openATerminer()">Zones à terminer (<b id="cnt-aterminer">0</b>)</a>
    <a id="team-link" class="hidden" onclick="openTeam()">👁 Vue équipe (<b id="team-cnt">0</b>)</a>
  </div>
</div>

<div id="fiche" class="sheet"><div class="sheet-grab"></div><div id="fiche-body"></div></div>
<div id="attente" class="sheet"><div class="sheet-grab"></div><div id="attente-body"></div></div>
<div id="arrival" class="sheet"><div class="sheet-grab"></div><div id="arrival-body"></div></div>
<div id="closure" class="sheet"><div class="sheet-grab"></div><div id="closure-body"></div></div>
<div id="list" class="sheet"><div class="sheet-grab"></div><div id="list-body"></div></div>
<button id="reshuffle" class="btn ghost" onclick="reshuffle()">↻ Proposer 5 autres secteurs</button>

<div id="toast"></div>
<div id="loader"><div class="ring"></div><div class="lt">Connexion…</div></div>
<div id="denied"><div class="ic">🔒</div><h2 id="dn-t">Accès</h2><p id="dn-s"></p></div>

<script>
/* ══════════════ Portéo — prospection par lotissement (vrai) ══════════════ */
const SHEETS_URL='https://script.google.com/macros/s/AKfycbxiLRobw1pG1J99MaWQpEqFiYhHnQHMsIGDfeliYT3Fivc1GkcJcU_v3wbTq9gMpoq2/exec';
const urlRowId=(()=>{const p=(location.pathname||'').split('/').filter(Boolean);const last=p[p.length-1];const q=new URLSearchParams(location.search).get('rowid');return (q||(last&&last!=='carte'&&last!=='index.html'&&last.indexOf('.html')<0?last:''))||'';})();

const BDNB_TILES='https://api.bdnb.io/v1/bdnb/tuiles/batiment_groupe/{z}/{x}/{y}.pbf';
const BDNB_SRC='sql_statement';
const CELL=0.003, MIN_MAISONS=4, MIN_COMPLET=0.4, MIN_ZOOM=14, DETAIL_ZOOM=15;
const IGN='https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
const ERA=[{c:'#dc2626',max:1949},{c:'#f97316',max:1979},{c:'#eab308',max:1999},{c:'#16a34a',max:3000}];
function eraOf(y){for(let i=0;i<ERA.length;i++)if(y<=ERA[i].max)return i;return 3;}

let map,_hybrid=null;
let state='search', shown=new Set(), proposal=[], chosen=null, nameCache={};
let isAdmin=false, userName='', clientId='', agingMonths=6;
let CELLSTATE={}, MINE=[], TEAM=[];    // état des cases (serveur)
let _pool=[], teamMarks=[];            // pool de secteurs autour (tirage) ; marqueurs vue équipe
function targetKey(){return 'porteo_target_'+(urlRowId||'x');}
function saveTarget(cx,cy,st){try{localStorage.setItem(targetKey(),JSON.stringify({cx,cy,state:st,t:Date.now()}));}catch(e){}}
function loadTarget(){try{return JSON.parse(localStorage.getItem(targetKey())||'null');}catch(e){return null;}}
function clearTarget(){try{localStorage.removeItem(targetKey());}catch(e){}}
function statColor(s){return s==='terminee'?'#9ca3af':s==='aterminer'?'#eab308':s==='nonpertinent'?'#cbd5e1':'#f07020';}
function statLabel(s){return s==='terminee'?'Terminé':s==='aterminer'?'À terminer':s==='nonpertinent'?'Non pertinent':'En cours';}
function key(cx,cy){return cx+'_'+cy;}
function square(cx,cy){const w=cx*CELL,e=(cx+1)*CELL,s=cy*CELL,n=(cy+1)*CELL;return [[w,s],[e,s],[e,n],[w,n],[w,s]];}
function center(cx,cy){return [(cx+0.5)*CELL,(cy+0.5)*CELL];}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- Vue satellite hybride ---------- */
async function hybrid(){
  if(_hybrid)return _hybrid;
  const base={version:8,glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources:{ign:{type:'raster',tiles:[IGN],tileSize:256,maxzoom:19}},
    layers:[{id:'bg',type:'background',paint:{'background-color':'#0b0b0b'}},{id:'ign',type:'raster',source:'ign'}]};
  try{const st=await (await fetch('https://tiles.openfreemap.org/styles/positron')).json();
    st.layers=st.layers.filter(l=>l.type==='symbol');
    st.layers.forEach(l=>{if(l.paint&&l.paint['text-color']){l.paint['text-color']='#fff';l.paint['text-halo-color']='rgba(0,0,0,.75)';l.paint['text-halo-width']=1.4;}});
    base.sources=Object.assign(base.sources,st.sources);base.glyphs=st.glyphs||base.glyphs;base.layers=base.layers.concat(st.layers);
  }catch(e){}
  _hybrid=base;return base;
}

/* ---------- Auth ---------- */
async function fetchJson(u){try{const r=await fetch(u);const t=await r.text();return JSON.parse(t);}catch(e){return null;}}
async function boot(){
  if(!urlRowId){ return deny('Accès refusé','Aucun identifiant dans le lien. Ouvre l’app depuis ton espace Portéo.'); }
  const mapP=initMap();   // on charge la carte EN PARALLÈLE de l'auth (ouverture plus rapide)
  let data=null;
  for(let a=0;a<5;a++){data=await fetchJson(SHEETS_URL+'?rowid='+encodeURIComponent(urlRowId)+'&t='+Date.now());if(data&&(!data.error||data.error==='notfound'))break;const lt=document.querySelector('#loader .lt');if(lt)lt.textContent='Connexion… ('+(a+2)+'/5)';await new Promise(r=>setTimeout(r,1000));}
  if(!data){await mapP.catch(()=>{});return deny('Serveur lent','Recharge la page.');}
  if(data.error==='notfound')return deny('Accès refusé','Identifiant non reconnu.');
  if(data.error)return deny('Erreur','Impossible de charger les données.');
  if(!data.isActive)return deny('Compte inactif','Ton compte n’est plus actif.');
  isAdmin=!!data.isAdmin;userName=(data.currentUser||'').trim();clientId=data.clientId||'';
  if(data.greenAfterMonths)agingMonths=data.greenAfterMonths;
  const chip=document.getElementById('username-chip');chip.textContent=(isAdmin?'👁 ':'')+userName;chip.classList.remove('hidden');
  if(isAdmin){const tl=document.getElementById('team-link');if(tl)tl.classList.remove('hidden');}
  await Promise.all([ mapP, refreshCellStates() ]);   // carte + états en parallèle
  document.getElementById('loader').classList.add('hidden');
  updateCounters();
  // Reprise : si une zone était « en attente/en cours », on y revient directement (pas l'écran de recherche)
  const t=loadTarget();
  if(t&&Number.isFinite(t.cx)&&Number.isFinite(t.cy)) restoreTarget(t);
}
async function restoreTarget(t){
  document.getElementById('search-screen').classList.add('hidden');
  document.getElementById('topbar').classList.remove('hidden');
  map.jumpTo({center:center(t.cx,t.cy),zoom:16});
  await new Promise(r=>map.once('idle',r));
  const cells=scanCells();let c=cells.find(x=>x.cx===t.cx&&x.cy===t.cy)||{cx:t.cx,cy:t.cy,n:0,fg:0,de:0,nd:0,era:3,houses:[]};
  chosen=c;
  if(t.state==='encours') arriveOK(); else chooseZone();
}
function deny(t,s){document.getElementById('loader').classList.add('hidden');document.getElementById('dn-t').textContent=t;document.getElementById('dn-s').textContent=s;document.getElementById('denied').style.display='flex';}
async function refreshCellStates(){
  const j=await fetchJson(SHEETS_URL+'?action=cellstates&rowid='+encodeURIComponent(urlRowId)+'&t='+Date.now());
  if(j&&j.cells){CELLSTATE={};j.cells.forEach(c=>CELLSTATE[c.k]=c);MINE=j.mine||[];TEAM=j.team||[];if(j.agingMonths)agingMonths=j.agingMonths;}
}

/* ---------- Init carte ---------- */
async function initMap(){
  const style=await hybrid();
  map=new maplibregl.Map({container:'map',style,center:[-0.556,47.472],zoom:12.5,attributionControl:false});
  await new Promise(res=>map.on('load',res));
  map.addSource('bdnb',{type:'vector',tiles:[BDNB_TILES],minzoom:14,maxzoom:14});
  map.addLayer({id:'bdnb-hit',type:'fill',source:'bdnb','source-layer':BDNB_SRC,paint:{'fill-color':'#000','fill-opacity':0}});
  map.addSource('mask',{type:'geojson',data:fc([])});
  map.addLayer({id:'mask-fill',type:'fill',source:'mask',paint:{'fill-color':'#0a0804','fill-opacity':0.66}});
  map.addSource('cells',{type:'geojson',data:fc([])});
  map.addLayer({id:'cells-fill',type:'fill',source:'cells',paint:{'fill-color':['get','col'],'fill-opacity':['get','op']}});
  map.addLayer({id:'cells-line',type:'line',source:'cells',paint:{'line-color':'#fff','line-width':2,'line-opacity':.9}});
  makeHatch();map.addSource('hatch',{type:'geojson',data:fc([])});
  map.addLayer({id:'hatch-fill',type:'fill',source:'hatch',paint:{'fill-pattern':'hatch'}});
  ensureQmark();map.addSource('qmarks',{type:'geojson',data:fc([])});
  map.addLayer({id:'qmark-lyr',type:'symbol',source:'qmarks',layout:{'icon-image':'qmark','icon-size':0.46,'icon-allow-overlap':true}});
  map.on('click','qmark-lyr',onQmarkClick);
  map.on('mouseenter','qmark-lyr',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','qmark-lyr',()=>map.getCanvas().style.cursor='');
  // DPE (ADEME) : un pin coloré par étiquette, à la place du « ? » quand un DPE existe
  ensureDpeImages();map.addSource('dpe',{type:'geojson',data:fc([])});
  ['A','B','C','D','E','F','G'].forEach(L=>{
    map.addLayer({id:'dpe-'+L,type:'symbol',source:'dpe',filter:['==',['get','letter'],L],
      layout:{'icon-image':['case',['>',['get','count'],1],'pin-'+L+'-multi','pin-'+L],'icon-size':['interpolate',['linear'],['zoom'],14,0.42,17,0.66,20,1.0],'icon-anchor':'bottom','icon-allow-overlap':true,'icon-ignore-placement':true}});
    map.on('click','dpe-'+L,e=>{const d=DPE_INDEX[e.features[0].properties.id];if(d)showDpePopup(e.lngLat,d);});
    map.on('mouseenter','dpe-'+L,()=>map.getCanvas().style.cursor='pointer');

function fc(f){return {type:'FeatureCollection',features:f};}
function makeHatch(){const s=12,c=document.createElement('canvas');c.width=s;c.height=s;const x=c.getContext('2d');x.fillStyle='rgba(240,112,32,0.30)';x.fillRect(0,0,s,s);x.strokeStyle='rgba(240,112,32,0.95)';x.lineWidth=3;x.beginPath();x.moveTo(-2,s+2);x.lineTo(s+2,-2);x.moveTo(s/2-2,s+2);x.lineTo(s+2,s/2-2);x.moveTo(-2,s/2+2);x.lineTo(s/2+2,-2);x.stroke();if(!map.hasImage('hatch'))map.addImage('hatch',x.getImageData(0,0,s,s));}
function ensureQmark(){if(map.hasImage&&map.hasImage('qmark'))return;const s=46,c=document.createElement('canvas');c.width=s;c.height=s;const x=c.getContext('2d');x.shadowColor='rgba(0,0,0,0.32)';x.shadowBlur=4;x.shadowOffsetY=1.5;x.beginPath();x.arc(s/2,s/2,s/2-5,0,Math.PI*2);x.fillStyle='rgba(255,255,255,0.7)';x.fill();x.shadowColor='transparent';x.lineWidth=1.4;x.strokeStyle='rgba(255,255,255,0.95)';x.stroke();x.fillStyle='#1a1208';x.font='700 23px "DM Sans",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('?',s/2,s/2+1);try{map.addImage('qmark',x.getImageData(0,0,s,s));}catch(e){}}

/* ---------- Scan BDNB → cellules (avec maisons + DPE) ---------- */
function scanCells(){
  let feats=[];try{feats=map.querySourceFeatures('bdnb',{sourceLayer:BDNB_SRC});}catch(e){}
  const cells={},seen={};
  feats.forEach(f=>{const p=f.properties||{};const id=p.batiment_groupe_id;if(id){if(seen[id])return;seen[id]=1;}
    const indiv=String(p.usage_principal_bdnb_open||'')==='Résidentiel individuel'||parseInt(p.nb_log)===1;if(!indiv)return;
    const c=centroid(f.geometry);if(!c)return;
    const cx=Math.floor(c[0]/CELL),cy=Math.floor(c[1]/CELL),k=cx+'_'+cy;
    const cell=cells[k]||(cells[k]={cx,cy,n:0,known:0,eras:[0,0,0,0],fg:0,de:0,nd:0,ys:[],houses:[]});
    cell.n++;const an=parseInt(p.annee_construction);const yr=(an>1700&&an<2100)?an:null;
    if(yr){cell.known++;cell.eras[eraOf(yr)]++;cell.ys.push(yr);}
    const dpe=String(p.classe_bilan_dpe||'').trim().toUpperCase();
    if(dpe==='F'||dpe==='G')cell.fg++;else if(dpe==='D'||dpe==='E')cell.de++;else cell.nd++;
    cell.houses.push({lon:c[0],lat:c[1],annee:yr});
  });
  return Object.values(cells).filter(c=>c.n>=MIN_MAISONS&&c.known>=1&&(c.known/c.n)>=MIN_COMPLET)
    .map(c=>{c.ys.sort((a,b)=>a-b);c.medY=c.ys.length?c.ys[Math.floor((c.ys.length-1)/2)]:null;c.era=c.medY!=null?eraOf(c.medY):3;return c;});
}
function centroid(g){if(!g||!g.coordinates)return null;let r=g.coordinates;while(Array.isArray(r[0])&&Array.isArray(r[0][0]))r=r[0];if(!Array.isArray(r[0]))return null;let sx=0,sy=0;r.forEach(p=>{sx+=p[0];sy+=p[1];});return [sx/r.length,sy/r.length];}

/* ---------- État / exclusion ---------- */
function stTaken(c){const s=CELLSTATE[key(c.cx,c.cy)];return !!(s&&s.recent);}   // pris = présence récente (dans le délai)
function recencyLabel(c){const s=CELLSTATE[key(c.cx,c.cy)];if(!s||!s.recent)return 'Jamais prospecté récemment';if(s.stat==='terminee')return 'Terminée le '+s.date;if(s.stat==='nonpertinent')return 'Classée non pertinente';if(s.stat==='aterminer')return 'À terminer — depuis le '+s.date;return 'En cours depuis le '+s.date;}

async function nameOf(c){const k=key(c.cx,c.cy);if(nameCache[k])return nameCache[k];const [lon,lat]=center(c.cx,c.cy);let nm='Secteur '+c.cx+'·'+c.cy;
  try{const j=await (await fetch('https://api-adresse.data.gouv.fr/reverse/?lon='+lon+'&lat='+lat)).json();const f=j.features&&j.features[0];
    if(f){const st=(f.properties.street||f.properties.name||'').replace(/^\d+\s*/,'').trim();const pc=f.properties.postcode||'',city=(f.properties.city||'').toUpperCase();if(st)nm='Zone proche de la '+st;nm+=(pc||city)?(', '+pc+' '+city):'';}
  }catch(e){}nameCache[k]=nm;return nm;}

/* ---------- 5 secteurs (cluster aléatoire dans un pool autour, sans dézoomer) ---------- */
let _seed=(Date.now()%100000);function fakeRand(x){_seed=(_seed*9301+49297+x)%233280;return _seed/233280;}
function dist2(a,b){const dx=a[0]-b[0],dy=a[1]-b[1];return dx*dx+dy*dy;}
function buildPool(){ _pool=scanCells().filter(c=>!stTaken(c)); }   // toutes les cases éligibles autour
function pickCluster(streetPt){
  let avail=_pool.filter(c=>!shown.has(key(c.cx,c.cy)));
  if(avail.length<3){ shown=new Set(); avail=_pool.slice(); }   // pool épuisé → on recommence le cycle
  if(!avail.length) return [];
  let anchor=null;
  if(streetPt){const kx=Math.floor(streetPt[0]/CELL),ky=Math.floor(streetPt[1]/CELL);anchor=avail.find(c=>c.cx===kx&&c.cy===ky);}
  if(!anchor) anchor=avail[Math.floor(fakeRand(avail.length)*avail.length)%avail.length];   // ancre au hasard
  const ac=center(anchor.cx,anchor.cy);
  return avail.slice().sort((a,b)=>dist2(center(a.cx,a.cy),ac)-dist2(center(b.cx,b.cy),ac)).slice(0,5);   // + les 4 plus proches
}
async function propose(streetPt){
  clearMarks(); closeSheets(); clearStatusLabels();   // efface les 5 secteurs précédents (cards + labels)
  if(!_pool.length){ buildPool(); if(!_pool.length){ await new Promise(r=>map.once('idle',r)); buildPool(); } }   // tuiles pas encore prêtes → on attend
  if(!_pool.length){ toast('Chargement des bâtiments… réessaie dans un instant'); return; }
  const pick=pickCluster(streetPt);
  if(!pick.length){ toast('Aucun secteur libre ici'); return; }
  proposal=pick; pick.forEach(c=>shown.add(key(c.cx,c.cy))); state='propose'; chosen=null;
  await drawProposal(); fitProposal();
}
function reshuffle(){ propose(null); }          // « 5 autres » : autre cluster au hasard, à proximité
function fitProposal(){if(!proposal.length)return;const b=new maplibregl.LngLatBounds();proposal.forEach(c=>square(c.cx,c.cy).forEach(p=>b.extend(p)));map.fitBounds(b,{padding:{top:90,bottom:90,left:50,right:50},maxZoom:16.5,duration:700});}
async function drawProposal(){clearMarks();setMask(proposal.map(c=>({cx:c.cx,cy:c.cy})));setCells(proposal.map(c=>({cx:c.cx,cy:c.cy,col:'#f07020',op:0.42})));setHatch([]);showReshuffle(true);
  for(const c of proposal){const nm=await nameOf(c);const short=nm.replace(/^Zone proche de la /,'').split(',')[0];
    const el=document.createElement('div');el.className='zmark';el.innerHTML='<div class="zm-card"><div class="zm-name">'+esc(short)+'</div><div class="zm-sub"><span>'+c.n+' maisons</span><span class="zm-fg">'+c.fg+' F/G</span></div></div><div class="zm-pin"></div>';

}

/* ---------- Arrivée (géoloc réelle) ---------- */
function distToCellMeters(lng,lat,cx,cy){const w=cx*CELL,e=(cx+1)*CELL,s=cy*CELL,n=(cy+1)*CELL;const mlon=111320*Math.cos(lat*Math.PI/180),mlat=110540;const dx=lng<w?(w-lng):lng>e?(lng-e):0;const dy=lat<s?(s-lat):lat>n?(n-lat):0;return Math.sqrt(Math.pow(dx*mlon,2)+Math.pow(dy*mlat,2));}
function tryArrive(){
  if(!navigator.geolocation){return arriveMsg('Localisation indisponible sur cet appareil.');}
  toast('Lecture de ta position…');
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude,accuracy}=pos.coords;
    if(accuracy>150){return arriveMsg('⚠️ Position imprécise ('+Math.round(accuracy)+' m). Attends d’avoir un meilleur signal GPS, puis réessaie.');}
    const d=distToCellMeters(longitude,latitude,chosen.cx,chosen.cy);
    if(d<=100)arriveOK();else arriveMsg('Tu es à '+Math.round(d)+' m du secteur. Approche-toi, puis actualise ta position.');
  },()=>arriveMsg('Position indisponible. Autorise la localisation, puis réessaie.'),{enableHighAccuracy:true,timeout:8000,maximumAge:8000});
}
function arriveMsg(m){const b=document.getElementById('attente-body');let w=document.getElementById('arr-warn');if(!w){w=document.createElement('div');w.id='arr-warn';w.className='warnbox';b.insertBefore(w,b.querySelector('button'));}w.textContent=m;}

  setStatusLabels([{cx:c.cx,cy:c.cy,text:'En cours',stat:''}]);
  document.getElementById('arrival-body').innerHTML='<h2>✅ Tu y es</h2><div class="loc">'+esc((nameCache[key(c.cx,c.cy)]||'').split(',')[0])+' · '+c.n+' maisons · '+c.fg+' en F/G</div><button class="btn big green" onclick="openClosure()">🚪 Frapper aux portes</button>';

  toast(kind==='terminee'?'✓ '+(nameCache[key(c.cx,c.cy)]||'Secteur').split(',')[0]+' terminé':kind==='aterminer'?'⏸ Mis de côté — reprenable quand tu veux':'Secteur classé non pertinent');

/* ---------- « ? » uniquement sur les secteurs actifs ---------- */
function activeCells(){if(state==='attente'||state==='encours')return chosen?[chosen]:[];return proposal;}
async function updateQmarks(){
  if(!map||!map.getSource('qmarks'))return;
  const cells=activeCells();
  if(!cells.length||map.getZoom()<DETAIL_ZOOM){setQmarks([]);if(map.getSource('dpe'))map.getSource('dpe').setData(fc([]));return;}
  // 1) DPE ADEME sur les cellules actives → pins colorés
  let dpts=[];try{dpts=await loadDpeForCells(cells);}catch(e){dpts=[];}
  DPE_INDEX={};const dfeats=[];
  dpts.forEach(d=>{DPE_INDEX[d.id]=d;dfeats.push({type:'Feature',properties:{id:d.id,letter:d.letter,count:d.history.length},geometry:{type:'Point',coordinates:[d.lon,d.lat]}});});
  if(map.getSource('dpe'))map.getSource('dpe').setData(fc(dfeats));
  // 2) « ? » seulement sur les maisons SANS DPE à proximité
  const B=0.00045,bset=new Set();dpts.forEach(d=>bset.add(Math.round(d.lon/B)+'_'+Math.round(d.lat/B)));
  function near(lon,lat){for(let ax=-1;ax<=1;ax++)for(let ay=-1;ay<=1;ay++){if(bset.has((Math.round(lon/B)+ax)+'_'+(Math.round(lat/B)+ay)))return true;}return false;}
  const feats=[];cells.forEach(c=>{(c.houses||[]).forEach(h=>{if(near(h.lon,h.lat))return;feats.push({type:'Feature',properties:{annee:h.annee||''},geometry:{type:'Point',coordinates:[h.lon,h.lat]}});});});
  setQmarks(feats);
}

async function onQmarkClick(e){const f=e.features[0];const an=f.properties.annee;const yr=(an&&+an>1700)?('🏠 Construite en <b>'+an+'</b>'):'🏠 Date non renseignée';
  const pop=new maplibregl.Popup({closeButton:false,offset:12,maxWidth:'240px'}).setLngLat(e.lngLat).setHTML('<div style="font-size:12.5px">'+yr+'<br><span id="qa">…</span></div>').addTo(map);
  try{const j=await (await fetch('https://api-adresse.data.gouv.fr/reverse/?lon='+e.lngLat.lng+'&lat='+e.lngLat.lat)).json();const g=j.features&&j.features[0];const el=document.getElementById('qa');if(el)el.textContent=g?g.properties.label:'';}catch(e2){}}

/* ---------- Mémo rues ---------- */
async function fillMemo(c){const el=document.getElementById('memo');if(!el)return;const pts=(c.houses||[]).slice(0,150);const res=[];
  await new Promise(done=>{let idx=0,run=0;const CONC=6;function nx(){if(idx>=pts.length){if(run===0)done();return;}const p=pts[idx++];run++;fetch('https://api-adresse.data.gouv.fr/reverse/?lon='+p.lon+'&lat='+p.lat+'&type=housenumber').then(r=>r.json()).then(j=>{const f=j.features&&j.features[0];if(f)res.push({num:f.properties.housenumber||'',street:f.properties.street||f.properties.name||''});}).catch(()=>{}).finally(()=>{run--;nx();});}for(let w=0;w<CONC;w++)nx();});
  const g={};res.forEach(r=>{const n=parseInt(String(r.num).replace(/[^0-9].*$/,''),10);if(!r.street||isNaN(n))return;const G=g[r.street]||(g[r.street]={s:r.street,min:n,max:n});if(n<G.min)G.min=n;if(n>G.max)G.max=n;});
  const arr=Object.values(g).sort((a,b)=>a.s.localeCompare(b.s,'fr'));el.innerHTML=arr.length?('<ul>'+arr.map(G=>'<li><b>'+(G.min===G.max?('N° '+G.min):('Du '+G.min+' au '+G.max))+'</b> '+esc(G.s)+'</li>').join('')+'</ul>'):'<i>Adresses non disponibles.</i>';}

    wrap.appendChild(row);}
}
function openATerminer(){const list=myOpen();if(!list.length){toast('Aucune zone à terminer');return;}showList('À terminer',list,isAdmin?'view':'resume');}
function openTeam(){if(!isAdmin)return;const byK={};(TEAM||[]).filter(t=>t.recent||t.stat).forEach(t=>{byK[t.k]=byK[t.k]||[];byK[t.k].push(t);});
  const list=[];Object.keys(byK).forEach(k=>byK[k].forEach(t=>list.push(t)));
  if(!list.length){toast('Aucune zone active dans l’équipe');return;}
  showList('Vue équipe — toutes les zones',list,'view');}
async function resumeZone(cx,cy){document.getElementById('search-screen').classList.add('hidden');document.getElementById('topbar').classList.remove('hidden');
  map.flyTo({center:center(cx,cy),zoom:16,duration:700});await new Promise(r=>map.once('moveend',r));
  const cells=scanCells();chosen=cells.find(x=>x.cx===cx&&x.cy===cy)||{cx,cy,n:0,fg:0,de:0,nd:0,era:3,houses:[]};chooseZone();}
async function viewZone(cx,cy,it){document.getElementById('search-screen').classList.add('hidden');document.getElementById('topbar').classList.remove('hidden');
  map.flyTo({center:center(cx,cy),zoom:16,duration:700});const nm=await nameOf({cx,cy});
  document.getElementById('fiche-body').innerHTML='<h2>'+esc(nm.split(',')[0])+'</h2><div class="loc">'+esc(nm.split(',').slice(1).join(',').trim())+'</div>'
    +'<div class="meta-line">👤 '+esc(it.name||'—')+'</div><div class="meta-line">🕒 '+statLabel(it.stat)+(it.date?(' · le '+it.date):'')+'</div>'
    +'<button class="btn ghost" onclick="openTeam()">← Liste équipe</button>';openSheet('fiche');}

/* ---------- Sources & sheets ---------- */
function setMask(cells){const world=[[-180,-85],[180,-85],[180,85],[-180,85],[-180,-85]];const holes=cells.map(c=>square(c.cx,c.cy));map.getSource('mask').setData(fc(cells.length?[{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[world].concat(holes)}}]:[]));}
function setCells(cells){map.getSource('cells').setData(fc(cells.map(c=>({type:'Feature',properties:{col:c.col,op:c.op},geometry:{type:'Polygon',coordinates:[square(c.cx,c.cy)]}}))));}
function setHatch(cells){map.getSource('hatch').setData(fc(cells.map(c=>({type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[square(c.cx,c.cy)]}}))));}
function openSheet(id){closeSheets();document.getElementById(id).classList.add('on');}
function closeSheets(){['fiche','attente','arrival','closure','list'].forEach(i=>document.getElementById(i).classList.remove('on'));}
let _tt=null;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),2600);}

/* ---------- Étiquettes de statut (texte au-dessus de la zone, pour ne pas dépendre que de la couleur) ---------- */
let _statusMarks=[];
function clearStatusLabels(){_statusMarks.forEach(m=>{try{m.remove();}catch(e){}});_statusMarks=[];}
function setStatusLabels(list){clearStatusLabels();(list||[]).forEach(it=>{
  const el=document.createElement('div');el.className='zstatus';el.style.borderBottom='3px solid '+statColor(it.stat);el.textContent=it.text;
  const lon=(it.cx+0.5)*CELL, latTop=(it.cy+1)*CELL;   // au bord haut de la zone
  _statusMarks.push(new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([lon,latTop]).addTo(map));});}

/* ══════════════ DPE (API ADEME) — pins colorés + card détaillée ══════════════ */
const ADEME_API='https://data.ademe.fr/data-fair/api/v1/datasets/dpe03existant/lines';
const SELECT_FIELDS=['etiquette_dpe','etiquette_ges','adresse_ban','adresse_brut','type_batiment','surface_habitable_logement','annee_construction','date_etablissement_dpe','date_visite_diagnostiqueur','numero_dpe','type_energie_principale_chauffage','type_generateur_chauffage_principal','periode_construction','qualite_isolation_plancher_bas','qualite_isolation_plancher_haut_comble_perdu','qualite_isolation_murs','qualite_isolation_menuiseries','qualite_isolation_enveloppe','cout_chauffage','type_ventilation','_geopoint'].join(',');
const DPE_COLORS={A:'#319834',B:'#33cc33',C:'#ccff33',D:'#ffff33',E:'#ffcc33',F:'#ff9933',G:'#ff3333'};
let DPE_INDEX={}, _dpeKey='', _dpeCache=[], _dpeLoadingKey='';
function makePinDataUrl(color,letter,hasMulti){
  const multi=hasMulti?'<circle cx="32" cy="11" r="8" fill="#1a1208" stroke="#fff" stroke-width="2"/><text x="32" y="14.5" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">+</text>':'';
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="40" height="56" viewBox="0 0 40 56">'
    +'<path d="M20 2 C10 2 2 10 2 19 C2 31 20 53 20 53 C20 53 38 31 38 19 C38 10 30 2 20 2 Z" fill="#1a1208"/>'
    +'<path d="M20 4 C11 4 4 11 4 19 C4 30 20 50 20 50 C20 50 36 30 36 19 C36 11 29 4 20 4 Z" fill="'+color+'" stroke="#fff" stroke-width="2.5"/>'
    +'<circle cx="20" cy="19" r="9.5" fill="#fff" stroke="#1a1208" stroke-width="0.8" stroke-opacity="0.3"/>'
    +'<text x="20" y="24" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#1a1208">'+letter+'</text>'+multi+'</svg>';
  return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
}
function ensureDpeImages(){['A','B','C','D','E','F','G'].forEach(l=>['','multi'].forEach(suf=>{
  const id='pin-'+l+(suf?'-'+suf:'');if(map.hasImage(id))return;
  const img=new Image(40,56);img.onload=()=>{if(!map.hasImage(id))map.addImage(id,img,{pixelRatio:2});};img.src=makePinDataUrl(DPE_COLORS[l],l,suf==='multi');}));}
function fmtDate(d){if(!d)return '—';const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?(m[3]+'/'+m[2]+'/'+m[1]):d;}
function summarizeChauffage(e,g){e=String(e||'').trim();g=String(g||'').trim();return (e&&g)?(e+' · '+g):(e||g||'—');}
function parseDpeRow(row){
  let lat=NaN,lon=NaN;if(row._geopoint){const p=String(row._geopoint).split(',');if(p.length>=2){lat=parseFloat(p[0]);lon=parseFloat(p[1]);}}
  if(!isFinite(lat)||!isFinite(lon))return null;
  const letter=String(row.etiquette_dpe||'').trim().toUpperCase();if(!DPE_COLORS[letter])return null;
  const surface=row.surface_habitable_logement;
  return {lat,lon,letter,ges:String(row.etiquette_ges||'').trim().toUpperCase(),address:String(row.adresse_ban||row.adresse_brut||''),
    type:String(row.type_batiment||''),surface:surface?Math.round(parseFloat(surface)):'',year:row.annee_construction||row.periode_construction||'',
    date:row.date_etablissement_dpe||row.date_visite_diagnostiqueur||'',chauffage:summarizeChauffage(row.type_energie_principale_chauffage,row.type_generateur_chauffage_principal),
    numero:row.numero_dpe||'',isoEnveloppe:String(row.qualite_isolation_enveloppe||''),isoPlancherBas:String(row.qualite_isolation_plancher_bas||''),
    isoToiture:String(row.qualite_isolation_plancher_haut_comble_perdu||''),isoMurs:String(row.qualite_isolation_murs||''),isoMenuiseries:String(row.qualite_isolation_menuiseries||''),
    coutChauffage:row.cout_chauffage||'',ventilation:String(row.type_ventilation||'')};
}
function dedupeDpe(raw){const groups=new Map();for(const p of raw){const k=(p.address||'').toLowerCase().trim()||(p.lat.toFixed(6)+','+p.lon.toFixed(6));if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p);}
  const out=[];let id=0;for(const [k,list] of groups){list.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));const h=list[0];out.push(Object.assign({id:'dpe_'+(id++),history:list},h));}return out;}
async function loadDpeForCells(cells){
  const k=cells.map(c=>key(c.cx,c.cy)).sort().join('|');
  if(k===_dpeKey)return _dpeCache;
  if(k===_dpeLoadingKey)return _dpeCache;
  _dpeLoadingKey=k;
  let minx=180,miny=90,maxx=-180,maxy=-90;
  cells.forEach(c=>{minx=Math.min(minx,c.cx*CELL);maxx=Math.max(maxx,(c.cx+1)*CELL);miny=Math.min(miny,c.cy*CELL);maxy=Math.max(maxy,(c.cy+1)*CELL);});
  const pad=0.0008,bbox=[minx-pad,miny-pad,maxx+pad,maxy+pad];const active=new Set(cells.map(c=>key(c.cx,c.cy)));
  let pts=[];
  try{const j=await (await fetch(ADEME_API+'?size=10000&bbox='+bbox.join(',')+'&select='+encodeURIComponent(SELECT_FIELDS))).json();
    const raw=(j.results||[]).map(parseDpeRow).filter(Boolean).filter(p=>active.has(Math.floor(p.lon/CELL)+'_'+Math.floor(p.lat/CELL)));
    pts=dedupeDpe(raw);
  }catch(e){}
  _dpeKey=k;_dpeCache=pts;_dpeLoadingKey='';return pts;
}
let _dpePopup=null;
function showDpePopup(lngLat,dpe){
  if(_dpePopup)_dpePopup.remove();
  const isoBadge=(val)=>{if(!val)return '—';const v=String(val).toLowerCase();let c='#9ca3af';
    if(v.includes('très bonne')||v.includes('tres bonne'))c='#319834';else if(v.includes('bonne'))c='#33cc33';else if(v.includes('moyenne'))c='#ffcc33';else if(v.includes('insuffisante'))c='#ff9933';
    return '<span style="display:inline-block;background:'+c+';color:'+((c==='#ff3333'||c==='#ff9933')?'#fff':'#1a1208')+';padding:1px 7px;border-radius:5px;font-weight:600;font-size:11px">'+val+'</span>';};
  const fmtCost=(n)=>{const v=parseFloat(n);return isFinite(v)?(Math.round(v).toLocaleString('fr-FR')+' €/an'):'';};
  const renderTab=(idx)=>{const cur=dpe.history[idx];const dc=DPE_COLORS[cur.letter]||'#999',gc=DPE_COLORS[cur.ges]||'#999';
    const dtc=(cur.letter==='F'||cur.letter==='G')?'#fff':'#1a1208',gtc=(cur.ges==='F'||cur.ges==='G')?'#fff':'#1a1208';
    const light=['B','C','D'].includes(cur.letter);const lbs=light?('background:#fff;color:#1a1208;border:3px solid '+dc):('background:#fff;color:'+dc+';border:2px solid rgba(0,0,0,0.1)');
    const hasIso=cur.isoEnveloppe||cur.isoPlancherBas||cur.isoToiture||cur.isoMurs||cur.isoMenuiseries;
    return '<div class="popup-header" style="background:'+dc+'"><div class="popup-letter-big" style="'+lbs+'">'+cur.letter+'</div><div><div class="popup-title" style="color:'+dtc+'">Étiquette DPE</div><div class="popup-class" style="color:'+dtc+'">Classe '+cur.letter+'</div></div></div>'
      +'<div class="popup-body">'
      +'<div class="popup-row"><span class="label">Adresse</span><span class="val">'+(cur.address||'—')+'</span></div>'
      +'<div class="popup-row"><span class="label">Type</span><span class="val">'+(cur.type||'—')+'</span></div>'
      +(cur.surface?'<div class="popup-row"><span class="label">Surface</span><span class="val">'+cur.surface+' m²</span></div>':'')
      +(cur.year?'<div class="popup-row"><span class="label">Construction</span><span class="val">'+cur.year+'</span></div>':'')
      +(cur.chauffage?'<div class="popup-row"><span class="label">Chauffage</span><span class="val">'+cur.chauffage+'</span></div>':'')
      +(cur.ventilation?'<div class="popup-row"><span class="label">Ventilation</span><span class="val">'+cur.ventilation+'</span></div>':'')
      +(cur.coutChauffage?'<div class="popup-section-divider"></div><div class="popup-section-title">💶 Coût annuel estimé</div><div class="popup-row"><span class="label">Chauffage</span><span class="val"><b>'+fmtCost(cur.coutChauffage)+'</b></span></div>':'')
      +(hasIso?'<div class="popup-section-divider"></div><div class="popup-section-title">🏗️ Qualité d\'isolation</div>'
        +(cur.isoEnveloppe?'<div class="popup-row"><span class="label">Enveloppe</span><span class="val">'+isoBadge(cur.isoEnveloppe)+'</span></div>':'')
        +(cur.isoMurs?'<div class="popup-row"><span class="label">Murs</span><span class="val">'+isoBadge(cur.isoMurs)+'</span></div>':'')
        +(cur.isoToiture?'<div class="popup-row"><span class="label">Toiture</span><span class="val">'+isoBadge(cur.isoToiture)+'</span></div>':'')
        +(cur.isoPlancherBas?'<div class="popup-row"><span class="label">Plancher bas</span><span class="val">'+isoBadge(cur.isoPlancherBas)+'</span></div>':'')
        +(cur.isoMenuiseries?'<div class="popup-row"><span class="label">Menuiseries</span><span class="val">'+isoBadge(cur.isoMenuiseries)+'</span></div>':''):'')
      +'<div class="popup-section-divider"></div>'
      +'<div class="popup-row"><span class="label">Date DPE</span><span class="val">'+fmtDate(cur.date)+'</span></div>'
      +(cur.ges?'<div class="popup-row"><span class="label">GES</span><span class="val"><span class="popup-ges" style="background:'+gc+';color:'+gtc+'">'+cur.ges+'</span></span></div>':'')
      +(cur.numero?'<div class="popup-row"><span class="label">N° DPE</span><span class="val" style="font-family:monospace;font-size:10px">'+cur.numero+'</span></div>':'')
      +'</div>';};
  let html=renderTab(0);
  if(dpe.history.length>1){let tabs='<div class="popup-tabs">';dpe.history.forEach((h,i)=>{const c=DPE_COLORS[h.letter]||'#999',tc=(h.letter==='F'||h.letter==='G')?'#fff':'#1a1208';
    tabs+='<div class="popup-tab '+(i===0?'active':'')+'" data-idx="'+i+'"><span class="tab-letter" style="background:'+c+';color:'+tc+'">'+h.letter+'</span>'+fmtDate(h.date)+'</div>';});tabs+='</div>';html=tabs+html;}
  _dpePopup=new maplibregl.Popup({closeButton:true,closeOnClick:true,maxWidth:'none',anchor:'bottom',offset:[0,-48],className:'dpe-popup'}).setLngLat(lngLat).setHTML(html).addTo(map);
  function bindTabs(){const pe=_dpePopup&&_dpePopup.getElement();if(!pe)return;pe.querySelectorAll('.popup-tab').forEach(tb=>{tb.addEventListener('click',()=>{const idx=parseInt(tb.dataset.idx);const th=pe.querySelector('.popup-tabs').outerHTML;_dpePopup.setHTML(th+renderTab(idx));setTimeout(()=>{const np=_dpePopup.getElement();np.querySelectorAll('.popup-tab').forEach((t,ti)=>t.classList.toggle('active',ti===idx));bindTabs();},10);});});}
  if(dpe.history.length>1)setTimeout(bindTabs,30);
  map.easeTo({center:lngLat,duration:300});
}

boot();
</script>
